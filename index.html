        async function updateOrderItemQty(orderId, itemIndex, delta) {
            const docRef = db.collection('orders').doc(orderId);
            const doc = await docRef.get();
            const order = doc.data();
            
            order.items[itemIndex].quantity += delta;
            
            if (order.items[itemIndex].quantity <= 0) {
                order.items.splice(itemIndex, 1);
            }
            
            if (order.items.length === 0) {
                await docRef.delete();
                loadPendingOrders();
                document.getElementById('orderDetail').innerHTML = '<p class="text-muted text-center">Sélectionnez une table</p>';
                return;
            }
            
            const subtotal = order.items.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const total = Math.round(subtotal * 1.1);
            
            await docRef.update({
                items: order.items,
                subtotal: subtotal,
                total: total
            });
            
            selectOrderForPayment(orderId);
        }
        
        async function removeOrderItem(orderId, itemIndex) {
            await updateOrderItemQty(orderId, itemIndex, -999);
        }
        
        async function processPaymentMethod(orderId, method) {
            const docRef = db.collection('orders').doc(orderId);
            const doc = await docRef.get();
            const order = doc.data();
            
            await db.collection('accountingEntries').add({
                type: 'revenue',
                orderId: orderId,
                amount: order.total,
                paymentMethod: method,
                establishmentId: order.establishmentId,
                description: `Table ${order.tableNumber} - ${method}`,
                createdBy: currentUser.uid,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            
            await docRef.update({
                status: 'paid',
                paymentMethod: method,
                paidAt: firebase.firestore.FieldValue.serverTimestamp(),
                paidBy: currentUser.uid
            });
            
            alert('✅ Paiement enregistré avec succès !');
            loadPendingOrders();
            document.getElementById('orderDetail').innerHTML = '<p class="text-muted text-center">Sélectionnez une table</p>';
        }

        let allStockData = [];
        let allIngredientsMap = {};
        
        async function loadStockData() {
            const tbody = document.getElementById('stockTableBody');
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">⏳ Chargement des matières premières...</td></tr>';
            
            // 1. Charger TOUTES les matières premières en UNE SEULE requête
            if (Object.keys(allIngredientsMap).length === 0) {
                const ingredientsSnap = await db.collection('items')
                    .where('type', '==', 'raw')
                    .where('active', '==', true)
                    .get();
                
                ingredientsSnap.docs.forEach(doc => {
                    allIngredientsMap[doc.id] = doc.data();
                });
            }
            
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">⏳ Chargement des stocks...</td></tr>';

            snapshot.docs.forEach(doc => {
                const stockData = doc.data();
                const itemData = allIngredientsMap[stockData.itemId];
                
                if (itemData) {

            const byCategory = {};

                byCategory[cat].push(stock);

        async function showStockAdjustment(stockId, itemName, currentQty) {

            modal.innerHTML = `
                <div class="modal-content" style="max-width: 500px;">

                            <strong>Nouveau stock:</strong> <span id="previewQty">—</span>

                    <div class="modal-footer">
                        <button class="btn btn-secondary" onclick="closeStockAdjustModal()">Annuler</button>
                        <button class="btn btn-primary" onclick="saveStockAdjustment('${stockId}', ${currentQty})">💾 Enregistrer</button>

                </div>
            `;
            
            document.body.appendChild(modal);
            
            // Update preview on input
            document.getElementById('qtyInput').addEventListener('input', updateStockPreview);
            document.getElementById('operationType').addEventListener('change', updateStockPreview);
            
            function updateStockPreview() {
                const opType = document.getElementById('operationType').value;
                const inputVal = parseInt(document.getElementById('qtyInput').value) || 0;
                const preview = document.getElementById('previewResult');
                const previewQty = document.getElementById('previewQty');
                
                let finalQty = currentQty;
                if (opType === 'set') {
                    finalQty = inputVal;
                    document.getElementById('qtyLabel').textContent = 'Nouvelle quantité';
                } else if (opType === 'add') {
                    finalQty = currentQty + inputVal;
                    document.getElementById('qtyLabel').textContent = 'Quantité à ajouter';
                } else if (opType === 'remove') {
                    finalQty = Math.max(0, currentQty - inputVal);
                    document.getElementById('qtyLabel').textContent = 'Quantité à retirer';
                }
                
                preview.style.display = 'block';
                previewQty.textContent = finalQty;
                previewQty.style.color = finalQty === 0 ? 'var(--danger)' : finalQty < 10 ? 'var(--warning)' : 'var(--success)';
            }
            
            updateStockPreview();
        }
        
        async function saveStockAdjustment(stockId, currentQty) {
            const opType = document.getElementById('operationType').value;
            const inputVal = parseInt(document.getElementById('qtyInput').value) || 0;
            const reason = document.getElementById('reasonInput').value;
            
            let finalQty = currentQty;
            if (opType === 'set') {
                finalQty = inputVal;
            } else if (opType === 'add') {
                finalQty = currentQty + inputVal;
            } else if (opType === 'remove') {
                finalQty = Math.max(0, currentQty - inputVal);
            }
            
            if (finalQty < 0) {
                alert('❌ La quantité ne peut pas être négative');
                return;
            }
            
            try {
                await db.collection('stock').doc(stockId).update({
                    quantity: finalQty,
                    lastUpdated: firebase.firestore.FieldValue.serverTimestamp(),
                    updatedBy: currentUser.uid,
                    lastReason: reason || 'Ajustement manuel'
                });
                
                // Log movement
                await db.collection('stockMovements').add({
                    stockId: stockId,
                    operationType: opType,
                    previousQty: currentQty,
                    change: opType === 'set' ? (finalQty - currentQty) : inputVal,
                    newQty: finalQty,
                    reason: reason || 'Ajustement manuel',
                    createdBy: currentUser.uid,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                alert('✅ Stock mis à jour !');
                closeStockAdjustModal();
                
                // Recharger la page stock actuelle
                if (currentPage === 'stock') {
                    loadStockData();
                }
            } catch (error) {
                alert('❌ Erreur: ' + error.message);
            }
        }

            if (modal) modal.remove();
        }

        async function saveBulkStockAdjustment() {
            const reason = document.getElementById('bulkReason').value || 'Livraison';
            const establishment = document.getElementById('bulkEstablishment').value;
            const updates = [];
            
            for (const ingId of window.bulkSelectedIngredients) {
                const qtyInput = document.getElementById(`bulk-qty-${ingId}`);
                const qty = parseInt(qtyInput.value);
                
                if (!qty || qty <= 0) {
                    alert(`❌ Veuillez saisir une quantité valide pour tous les articles sélectionnés`);
                    return;
                }
                
                updates.push({ ingId, qty });
            }
            
            if (updates.length === 0) {
                alert('❌ Aucun article sélectionné');
                return;
            }
            
            try {
                const batch = db.batch();
                
                for (const { ingId, qty } of updates) {
                    // Chercher ou créer le stock
                    const stockQuery = await db.collection('stock')
                        .where('itemId', '==', ingId)
                        .where('establishmentId', '==', establishment)
                        .get();
                    
                    let stockRef;
                    let currentQty = 0;
                    
                    if (stockQuery.empty) {
                        // Créer nouveau stock
                        stockRef = db.collection('stock').doc();
                        batch.set(stockRef, {
                            itemId: ingId,
                            establishmentId: establishment,
                            quantity: qty,
                            lastUpdated: firebase.firestore.FieldValue.serverTimestamp(),
                            updatedBy: currentUser.uid,
                            lastReason: reason
                        });
                    } else {
                        // Mettre à jour stock existant
                        const stockDoc = stockQuery.docs[0];
                        stockRef = stockDoc.ref;
                        currentQty = stockDoc.data().quantity || 0;
                        
                        batch.update(stockRef, {
                            quantity: currentQty + qty,
                            lastUpdated: firebase.firestore.FieldValue.serverTimestamp(),
                            updatedBy: currentUser.uid,
                            lastReason: reason
                        });
                    }
                    
                    // Log movement
                    const movementRef = db.collection('stockMovements').doc();
                    batch.set(movementRef, {
                        stockId: stockRef.id,
                        itemId: ingId,
                        establishmentId: establishment,
                        operationType: 'add',
                        previousQty: currentQty,
                        change: qty,
                        newQty: currentQty + qty,
                        reason: reason,
                        createdBy: currentUser.uid,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
                
                await batch.commit();
                
                alert(`✅ Livraison enregistrée !\n${updates.length} article(s) ajouté(s) au stock.`);
                closeBulkStockModal();
                
                // Recharger
                if (currentPage === 'stock') {
                    loadStockData();
                }
                
            } catch (error) {
                alert('❌ Erreur: ' + error.message);
                console.error(error);
            }
        }

        }

                return matchSearch && matchStatus;

        function filterRecipes() {
            const search = document.getElementById('searchRecipes').value.toLowerCase();
            const establishment = document.getElementById('recipeEstablishment').value;
            const status = document.getElementById('recipeStatus').value;
            
            const filtered = allRecipes.filter(recipe => {
                const matchSearch = recipe.name.toLowerCase().includes(search) ||
                    (recipe.category && recipe.category.toLowerCase().includes(search));
                
                const matchEstablishment = !establishment || 
                    (recipe.establishments && recipe.establishments.includes(establishment));
                
                let matchStatus = true;
                if (status === 'configured') {
                    matchStatus = recipe.components && recipe.components.length > 0;
                } else if (status === 'missing') {
                    matchStatus = !recipe.components || recipe.components.length === 0;
                }
                
                return matchSearch && matchEstablishment && matchStatus;
            });
            
            renderRecipesList(filtered);
        }
        
        async function editRecipe(itemId) {
            try {
                const itemDoc = await db.collection('items').doc(itemId).get();
                if (!itemDoc.exists) {
                    alert('❌ Article non trouvé');
                    return;
                }
                
                const item = itemDoc.data();
                const currentComponents = item.components || [];
                
                // Charger UNIQUEMENT les ingrédients (matières premières, type:'raw')
                // PAS les produits finis (type:'finished')
                const ingredientsSnap = await db.collection('items')
                    .where('type', '==', 'raw')
                    .where('active', '==', true)
                    .get();
                
                // Trier côté client au lieu de Firestore (évite les problèmes d'index)
                const ingredients = ingredientsSnap.docs
                    .map(doc => ({ id: doc.id, ...doc.data() }))
                    .sort((a, b) => {
                        const catCompare = (a.category || '').localeCompare(b.category || '');
                        if (catCompare !== 0) return catCompare;
                        return (a.name || '').localeCompare(b.name || '');
                    });
                
                if (ingredients.length === 0) {
                    alert('⚠️ Aucun ingrédient trouvé. Veuillez d\'abord créer des matières premières (type: raw) dans la page Stocks.');
                    return;
                }
                
                // Grouper par catégorie

                ingredients.forEach(ing => {
                    const cat = ing.category || 'Non catégorisé';
                    if (!byCategory[cat]) byCategory[cat] = [];
                    byCategory[cat].push(ing);
                });
                
                let ingredientsHTML = '';
                Object.entries(byCategory).sort().forEach(([category, ings]) => {
                    ingredientsHTML += `
                        <div style="margin-bottom: var(--spacing-lg);">

                            <div style="display: flex; flex-direction: column; gap: var(--spacing-sm);">

                                    <strong>${ing.name}</strong>

                                </label>
                                <input type="number" id="qty-${ing.id}" class="form-control" 
                                    style="width: 100px;" placeholder="Qté" min="0" step="0.1"

                modal.innerHTML = `

        function filterRecipeIngredients() {
            const searchInput = document.getElementById('recipeSearchInput');
            if (!searchInput) return;
            
            const searchTerm = searchInput.value.toLowerCase().trim();
            const categories = document.querySelectorAll('#ingredientsList > div');
            
            let totalVisible = 0;
            let totalIngredients = 0;
            
            categories.forEach(catDiv => {
                const ingredients = catDiv.querySelectorAll('div[style*="display: flex"]');
                let visibleCount = 0;
                
                ingredients.forEach(ingDiv => {
                    totalIngredients++;
                    const label = ingDiv.querySelector('label');
                    if (!label) return;
                    
                    const text = label.textContent.toLowerCase();
                    const matches = searchTerm === '' || text.includes(searchTerm);
                    
                    if (matches) {
                        ingDiv.style.display = 'flex';
                        visibleCount++;
                        totalVisible++;
                    } else {
                        ingDiv.style.display = 'none';
                    }
                });
                
                // Masquer la catégorie si aucun ingrédient visible
                catDiv.style.display = visibleCount > 0 ? 'block' : 'none';
            });
            
            // Mettre à jour le compteur
            const countSpan = document.getElementById('ingredientsCount');
            if (countSpan) {
                if (searchTerm === '') {
                    countSpan.textContent = `(${totalIngredients} disponibles)`;
                } else {
                    countSpan.textContent = `(${totalVisible}/${totalIngredients} trouvés)`;
                }
            }
        }
        
        
        function updateIngredientCount() {
            const ingredients = document.querySelectorAll('#ingredientsList div[style*="display: flex"]');
            const countSpan = document.getElementById('ingredientsCount');
            if (countSpan) {
                countSpan.textContent = `(${ingredients.length} disponibles)`;
            }
        }
        
        
        function toggleIngredient(ingId, ingName, checked) {
            if (!window.selectedIngredients) {
                window.selectedIngredients = new Set();
            }
            
            const qtyInput = document.getElementById(`qty-${ingId}`);
            
            if (checked) {
                window.selectedIngredients.add(ingId);
                qtyInput.disabled = false;
                if (!qtyInput.value || qtyInput.value === '0') {
                    qtyInput.value = 1;
                }
                qtyInput.focus();
            } else {
                window.selectedIngredients.delete(ingId);
                qtyInput.disabled = true;
            }
        }
        
        async function saveRecipe(itemId) {
            try {
                const components = [];
                
                // Récupérer tous les ingrédients cochés
                const checkboxes = document.querySelectorAll('#ingredientsList input[type="checkbox"]:checked');
                
                if (checkboxes.length === 0) {
                    alert('⚠️ Veuillez sélectionner au moins un ingrédient');
                    return;
                }
                
                for (const checkbox of checkboxes) {
                    const ingId = checkbox.id.replace('ing-', '');
                    const qtyInput = document.getElementById(`qty-${ingId}`);
                    const quantity = parseFloat(qtyInput.value);
                    
                    if (!quantity || quantity <= 0) {
                        alert(`⚠️ Veuillez saisir une quantité valide pour tous les ingrédients sélectionnés`);
                        qtyInput.focus();
                        return;
                    }
                    
                    // Récupérer le nom de l'ingrédient
                    const label = checkbox.nextElementSibling;
                    const ingName = label.querySelector('strong').textContent;
                    
                    components.push({
                        itemId: ingId,
                        itemName: ingName,
                        quantity: quantity
                    });
                }
                
                await db.collection('items').doc(itemId).update({
                    components: components,
                    lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                alert(`✅ Recette enregistrée avec succès !\n${components.length} ingrédient(s) configuré(s).`);
                closeRecipeModal();
                loadRecipesList();
                
            } catch (error) {
                console.error('Erreur lors de l\'enregistrement:', error);
                alert('❌ Erreur: ' + error.message);
            }
        }
        
        async function clearRecipe(itemId) {
            if (!confirm('Supprimer la recette de ce plat ? Les ventes futures ne déduiront plus les stocks.')) return;
            
            try {
                await db.collection('items').doc(itemId).update({
                    components: [],
                    lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                alert('✅ Recette supprimée');
                loadRecipesList();
            } catch (error) {
                alert('❌ Erreur: ' + error.message);
            }
        }
        
        function closeRecipeModal() {
            const modal = document.getElementById('recipeModal');
            if (modal) modal.remove();
            // Nettoyer les données temporaires
            if (window.selectedIngredients) {
                window.selectedIngredients = null;
            }
        }

        async function loadReportsData() {
            const startDate = document.getElementById('reportStartDate')?.value;
            const endDate = document.getElementById('reportEndDate')?.value;
            const establishment = document.getElementById('reportEstablishment')?.value;
            
            let query = db.collection('orders').where('status', '==', 'paid');
            
            if (startDate) {
                query = query.where('paidAt', '>=', new Date(startDate));
            }
            if (endDate) {
                const end = new Date(endDate);
                end.setHours(23, 59, 59);
                query = query.where('paidAt', '<=', end);
            }
            if (establishment) {
                query = query.where('establishmentId', '==', establishment);
            }
            
            const snapshot = await query.get();
            
            let totalRevenue = 0;
            let orderCount = 0;
            let cashTotal = 0;
            const itemStats = {};
            const categoryStats = {};
            
            for (const doc of snapshot.docs) {
                const order = doc.data();
                totalRevenue += order.total || 0;
                orderCount++;
                
                if (order.paymentMethod === 'cash') {
                    cashTotal += order.total || 0;
                }
                
                for (const item of order.items || []) {
                    if (!itemStats[item.itemId]) {
                        itemStats[item.itemId] = {
                            name: item.itemName,
                            quantity: 0,
                            revenue: 0
                        };
                    }
                    itemStats[item.itemId].quantity += item.quantity;
                    itemStats[item.itemId].revenue += (item.price * item.quantity);
                    
                    // Récupérer la catégorie
                    const itemDoc = await db.collection('items').doc(item.itemId).get();
                    if (itemDoc.exists) {
                        const cat = itemDoc.data().category || 'Non catégorisé';
                        if (!categoryStats[cat]) {
                            categoryStats[cat] = { quantity: 0, revenue: 0 };
                        }
                        categoryStats[cat].quantity += item.quantity;
                        categoryStats[cat].revenue += (item.price * item.quantity);
                    }
                }
            }
            
            const avgTicket = orderCount > 0 ? Math.round(totalRevenue / orderCount) : 0;
            
            setTimeout(() => {
                if (document.getElementById('reportRevenue')) {
                    document.getElementById('reportRevenue').textContent = `${totalRevenue.toLocaleString()} F`;
                    document.getElementById('reportOrderCount').textContent = orderCount;
                    document.getElementById('reportAvgTicket').textContent = `${avgTicket.toLocaleString()} F`;
                    document.getElementById('reportCash').textContent = `${cashTotal.toLocaleString()} F`;
                }
            }, 100);
            
            // Top items
            const topItems = Object.values(itemStats)
                .sort((a, b) => b.quantity - a.quantity)
                .slice(0, 10);
            
            const topItemsBody = document.getElementById('topItemsBody');
            if (topItemsBody) {
                if (topItems.length === 0) {
                    topItemsBody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Aucune donnée</td></tr>';
                } else {
                    topItemsBody.innerHTML = topItems.map((item, index) => `
                        <tr>
                            <td><strong>#${index + 1}</strong></td>
                            <td>${item.name}</td>
                            <td><strong>${item.quantity}</strong></td>
                            <td><strong>${Math.round(item.revenue).toLocaleString()} F</strong></td>
                        </tr>
                    `).join('');
                }
            }
            
            // Category stats
            const categoryList = Object.entries(categoryStats)
                .map(([name, stats]) => ({ name, ...stats }))
                .sort((a, b) => b.revenue - a.revenue);
            
            const categoryStatsBody = document.getElementById('categoryStatsBody');
            if (categoryStatsBody) {
                if (categoryList.length === 0) {
                    categoryStatsBody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Aucune donnée</td></tr>';
                } else {
                    categoryStatsBody.innerHTML = categoryList.map(cat => {
                        const percent = totalRevenue > 0 ? ((cat.revenue / totalRevenue) * 100).toFixed(1) : 0;
                        return `
                            <tr>
                                <td><strong>${cat.name}</strong></td>
                                <td>${cat.quantity}</td>
                                <td><strong>${Math.round(cat.revenue).toLocaleString()} F</strong></td>
                                <td>${percent}%</td>
                            </tr>
                        `;
                    }).join('');
                }
            }
        }

                    <div class="modal-footer">

                        </button>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
        }
        
        function updatePermissionsPreset() {
            const role = document.getElementById('userRole')?.value;
            const checkboxes = document.querySelectorAll('.permission-checkbox');
            
            // Désélectionner tout
            checkboxes.forEach(cb => cb.checked = false);
            
            if (role === 'admin') {
                // Admin : tout
                checkboxes.forEach(cb => cb.checked = true);
            } else if (role === 'serveur') {
                // Serveur : POS + KDS + Paiements
                document.getElementById('perm-dashboard').checked = true;
                document.getElementById('perm-pos').checked = true;
                document.getElementById('perm-kds').checked = true;
                document.getElementById('perm-payments').checked = true;
            } else if (role === 'cuisine') {
                // Cuisine : KDS uniquement
                document.getElementById('perm-kds').checked = true;
            }
            // Si custom : laisser l'utilisateur choisir
        }
        
        async function handleCreateUser(event) {
            event.preventDefault();
            
            try {
                const name = document.getElementById('userName').value.trim();
                const email = document.getElementById('userEmail').value.trim();
                const password = document.getElementById('userPassword').value;
                const role = document.getElementById('userRole').value;
                const active = document.getElementById('userActive').checked;
                
                // Récupérer les permissions
                const permissions = {
                    'dashboard': document.getElementById('perm-dashboard').checked,
                    'pos': document.getElementById('perm-pos').checked,
                    'kds': document.getElementById('perm-kds').checked,
                    'payments': document.getElementById('perm-payments').checked,
                    'items': document.getElementById('perm-items').checked,
                    'stock': document.getElementById('perm-stock').checked,
                    'recipes': document.getElementById('perm-recipes').checked,
                    'reports': document.getElementById('perm-reports').checked
                };
                
                // Créer l'utilisateur dans Firebase Auth
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const userId = userCredential.user.uid;
                
                // Créer le document utilisateur dans Firestore
                await db.collection('users').doc(userId).set({
                    name: name,
                    email: email,
                    role: role,
                    active: active,
                    permissions: permissions,
                    createdAt: new Date(),
                    createdBy: currentUser.uid
                });
                
                alert('✅ Utilisateur créé avec succès !');
                closeUserModal();
                loadUsersData();
                
                // Se reconnecter avec le compte admin actuel
                // (la création a déconnecté l'admin)
                window.location.reload();
                
            } catch (error) {
                console.error('Erreur création utilisateur:', error);
                alert('❌ Erreur: ' + error.message);
            }
        }

                                            <label style="display: flex; align-items: center; gap: var(--spacing-sm);">

        function updateEditPermissionsPreset() {
            const role = document.getElementById('editUserRole')?.value;
            const checkboxes = document.querySelectorAll('.edit-permission-checkbox');
            
            // Désélectionner tout
            checkboxes.forEach(cb => cb.checked = false);
            
            if (role === 'admin') {
                // Admin : tout
                checkboxes.forEach(cb => cb.checked = true);
            } else if (role === 'serveur') {
                // Serveur : POS + KDS + Paiements
                document.getElementById('edit-perm-dashboard').checked = true;
                document.getElementById('edit-perm-pos').checked = true;
                document.getElementById('edit-perm-kds').checked = true;
                document.getElementById('edit-perm-payments').checked = true;

        async function handleEditUser(event, userId) {
            event.preventDefault();
            
            try {
                const name = document.getElementById('editUserName').value.trim();
                const role = document.getElementById('editUserRole').value;
                const active = document.getElementById('editUserActive').checked;
                
                // Récupérer les permissions
                const permissions = {
                    'dashboard': document.getElementById('edit-perm-dashboard').checked,
                    'pos': document.getElementById('edit-perm-pos').checked,
                    'kds': document.getElementById('edit-perm-kds').checked,
                    'payments': document.getElementById('edit-perm-payments').checked,
                    'items': document.getElementById('edit-perm-items').checked,
                    'stock': document.getElementById('edit-perm-stock').checked,
                    'recipes': document.getElementById('edit-perm-recipes').checked,
                    'reports': document.getElementById('edit-perm-reports').checked
                };
                
                // Mettre à jour le document utilisateur
                await db.collection('users').doc(userId).update({
                    name: name,
                    role: role,
                    active: active,
                    permissions: permissions,
                    updatedAt: new Date(),
                    updatedBy: currentUser.uid
                });
                
                alert('✅ Utilisateur modifié avec succès !');
                closeUserModal();
                loadUsersData();
                
            } catch (error) {
                console.error('Erreur modification utilisateur:', error);
                alert('❌ Erreur: ' + error.message);
            }
        }
        
        async function toggleUserStatus(userId, newStatus) {
            if (!confirm(`Êtes-vous sûr de vouloir ${newStatus ? 'activer' : 'désactiver'} cet utilisateur ?`)) {
                return;
            }
            
            try {
                await db.collection('users').doc(userId).update({
                    active: newStatus,
                    updatedAt: new Date(),
                    updatedBy: currentUser.uid
                });
                
                alert(`✅ Utilisateur ${newStatus ? 'activé' : 'désactivé'} avec succès !`);
                loadUsersData();
                
            } catch (error) {
                console.error('Erreur changement statut:', error);
                alert('❌ Erreur: ' + error.message);
            }
        }
        
        function closeUserModal() {
            const modal = document.getElementById('userModal');
            if (modal) {
                modal.remove();
            }
        }
        
        // ============================================
        // NAVIGATION
        // ============================================
        function navigateTo(page) {
            // Vérifier les permissions
            const permissions = currentUser.permissions || {};
            const isAdmin = currentUser.role === 'admin';
            
            // Pages nécessitant une vérification de permission
            const protectedPages = ['dashboard', 'pos', 'kds', 'payments', 'items', 'stock', 'recipes', 'reports'];
            
            // Vérifier l'accès
            if (protectedPages.includes(page) && !isAdmin && !permissions[page]) {
                alert('❌ Accès refusé : Vous n\'avez pas la permission d\'accéder à cette page.');
                return;
            }
            
            // Page users réservée aux admins
            if (page === 'users' && !isAdmin) {
                alert('❌ Accès refusé : Seuls les administrateurs peuvent gérer les utilisateurs.');
                return;
            }
            
            currentPage = page;
            renderApp();
            
            // Réduire automatiquement la sidebar sur desktop pour pages POS et KDS
            if (window.innerWidth > 768 && (page === 'pos' || page === 'kds')) {
                setTimeout(() => {
                    const sidebar = document.getElementById('sidebar');
                    const mainContent = document.getElementById('mainContent');
                    if (sidebar && !sidebar.classList.contains('collapsed')) {
                        sidebar.classList.add('collapsed');
                        if (mainContent) mainContent.classList.add('sidebar-collapsed');
                        localStorage.setItem('sidebarCollapsed', 'true');
                        const icon = document.getElementById('sidebarToggleIcon');
                        if (icon) icon.textContent = '›';
                    }
                }, 100);
            }
            
            // Fermer la sidebar mobile après navigation
            if (window.innerWidth <= 768) {
                closeMobileSidebar();
            }
        }
        
        function toggleMobileSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            
            if (sidebar && overlay) {
                sidebar.classList.toggle('mobile-visible');
                overlay.classList.toggle('active');
                
                // Empêcher le scroll du body quand le menu est ouvert
                if (sidebar.classList.contains('mobile-visible')) {
                    document.body.style.overflow = 'hidden';
                } else {
                    document.body.style.overflow = '';
                }
            }
        }
        
        function closeMobileSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            
            if (sidebar && overlay) {
                sidebar.classList.remove('mobile-visible');
                overlay.classList.remove('active');
                document.body.style.overflow = '';
            }
        }
        
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('mainContent');
            const icon = document.getElementById('sidebarToggleIcon');
            
            if (sidebar && mainContent && icon) {
                sidebar.classList.toggle('collapsed');
                mainContent.classList.toggle('sidebar-collapsed');
                
                if (sidebar.classList.contains('collapsed')) {
                    icon.textContent = '›';
                    localStorage.setItem('sidebarCollapsed', 'true');
                } else {
                    icon.textContent = '‹';
                    localStorage.setItem('sidebarCollapsed', 'false');
                }
            }
        }
        
        function restoreSidebarState() {
            const isCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
            if (isCollapsed && window.innerWidth > 768) {
                const sidebar = document.getElementById('sidebar');
                const mainContent = document.getElementById('mainContent');
                const icon = document.getElementById('sidebarToggleIcon');
                
                if (sidebar && mainContent && icon) {
                    sidebar.classList.add('collapsed');
                    mainContent.classList.add('sidebar-collapsed');
                    icon.textContent = '›';
                }
            }
        }
        
        function attachEventListeners() {
            // Les event listeners sont gérés via onclick inline pour simplifier
            
            // Fermer la sidebar si on redimensionne vers desktop
            window.addEventListener('resize', () => {
                if (window.innerWidth > 768) {
                    closeMobileSidebar();
                }
            });
        }
        
        // ============================================
        // INITIALIZATION
        // ============================================
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const userDoc = await db.collection('users').doc(user.uid).get();
                if (userDoc.exists && userDoc.data().active) {
                    currentUser = { uid: user.uid, ...userDoc.data() };
                    
                    // Initialiser l'écoute des ruptures de stock
                    initOutOfStockListener();
                    
                    // Rediriger vers la première page autorisée si on est sur login
                    if (currentPage === 'login') {
                        const permissions = currentUser.permissions || {};
                        const isAdmin = currentUser.role === 'admin';
                        
                        // Liste des pages par ordre de priorité
                        const pageOrder = ['dashboard', 'pos', 'kds', 'payments', 'items', 'stock', 'recipes', 'reports'];
                        
                        // Trouver la première page autorisée
                        if (isAdmin) {
                            currentPage = 'dashboard';
                        } else {
                            const firstAllowedPage = pageOrder.find(page => permissions[page]);
                            currentPage = firstAllowedPage || 'dashboard';
                        }
                    }
                } else {
                    // Arrêter l'écoute si déconnecté
                    if (outOfStockUnsubscribe) {
                        outOfStockUnsubscribe();
                        outOfStockUnsubscribe = null;
                    }
                }
            }
            renderApp();
        });
    </script>
</body>
