<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestionResto - Application Complète</title>
    
    <style>
        /* ============================================
           DESIGN SYSTEM MODERNE
           ============================================ */
        :root {
            --primary: #667eea;
            --primary-dark: #5a67d8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-500: #6b7280;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            
            --radius: 0.5rem;
            --radius-lg: 1rem;
            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
            
            /* Responsive variables */
            --sidebar-width: 260px;
            --header-height: 60px;
            --grid-gap: 1.5rem;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--gray-50);
            color: var(--text-primary);
            line-height: 1.6;
        }
        
        /* ============================================
           LAYOUT
           ============================================ */
        .app-container {
            display: flex;
            min-height: 100vh;
        }
        
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            padding: var(--spacing-lg);
            overflow-y: auto;
            z-index: 1000;
            transition: all 0.3s ease;
        }
        
        .sidebar.collapsed {
            width: 70px;
            padding: var(--spacing-sm);
        }
        
        .sidebar.collapsed .sidebar-logo,
        .sidebar.collapsed .nav-item span,
        .sidebar.collapsed .user-info-content {
            display: none;
        }
        
        .sidebar.collapsed .nav-item {
            justify-content: center;
            padding: var(--spacing-md);
        }
        
        .sidebar.collapsed .user-info {
            justify-content: center;
            padding: var(--spacing-md);
        }
        
        .sidebar.mobile-hidden {
            transform: translateX(-100%);
        }
        
        .sidebar-toggle {
            position: absolute;
            top: var(--spacing-md);
            right: -15px;
            background: var(--primary);
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            z-index: 1001;
            box-shadow: var(--shadow-md);
            transition: all 0.3s;
        }
        
        .sidebar-toggle:hover {
            background: var(--primary-dark);
            transform: scale(1.1);
        }
        
        .sidebar-logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            margin-bottom: var(--spacing-xl);
            padding-bottom: var(--spacing-md);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .mobile-header {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-height);
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            color: white;
            align-items: center;
            padding: 0 var(--spacing-md);
            z-index: 999;
            box-shadow: var(--shadow);
        }
        
        .hamburger-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            padding: var(--spacing-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: var(--radius);
            transition: background 0.3s;
        }
        
        .hamburger-btn:hover {
            background: rgba(255,255,255,0.1);
        }
        
        .mobile-header h1 {
            font-size: 1.25rem;
            margin-left: var(--spacing-md);
            font-weight: 600;
        }
        
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }
        
        .sidebar-overlay.active {
            display: block;
        }
        
        .nav-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            padding: var(--spacing-md);
            color: rgba(255,255,255,0.7);
            border-radius: var(--radius);
            cursor: pointer;
            margin-bottom: var(--spacing-sm);
            transition: all 0.3s;
        }
        
        .nav-item:hover, .nav-item.active {
            background: rgba(255,255,255,0.1);
            color: white;
        }
        
        .main-content {
            margin-left: 260px;
            padding: var(--spacing-xl);
            flex: 1;
            transition: margin-left 0.3s ease;
        }
        
        .main-content.sidebar-collapsed {
            margin-left: 70px;
        }
        
        /* ============================================
           COMPONENTS
           ============================================ */
        .card {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            padding: var(--spacing-xl);
            margin-bottom: var(--spacing-lg);
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-md) var(--spacing-xl);
            border: none;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        
        .btn-primary:hover {
            background: var(--primary-dark);
        }
        
        .btn-success {
            background: var(--success);
            color: white;
        }
        
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        
        .btn-sm {
            padding: var(--spacing-sm) var(--spacing-md);
            font-size: 0.875rem;
        }
        
        .form-control {
            width: 100%;
            padding: var(--spacing-md);
            border: 2px solid var(--gray-200);
            border-radius: var(--radius);
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .form-group {
            margin-bottom: var(--spacing-lg);
        }
        
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: var(--spacing-sm);
            color: var(--text-primary);
        }
        
        /* ============================================
           STATS CARDS
           ============================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-xl);
        }
        
        .stat-card {
            background: white;
            padding: var(--spacing-xl);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            border-left: 4px solid var(--primary);
        }
        
        .stat-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-sm);
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        
        /* ============================================
           POS LAYOUT
           ============================================ */
        .pos-layout {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: var(--spacing-xl);
            height: calc(100vh - 100px);
            overflow: hidden;
        }
        
        .pos-layout.cart-collapsed {
            grid-template-columns: 1fr 60px;
        }
        
        .pos-items-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }
        
        .pos-filters {
            flex-shrink: 0;
            margin-bottom: var(--spacing-md);
        }
        
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: var(--spacing-md);
            overflow-y: auto;
            padding: var(--spacing-md);
        }
        
        .items-grid::-webkit-scrollbar {
            width: 8px;
        }
        
        .items-grid::-webkit-scrollbar-track {
            background: var(--gray-100);
            border-radius: 4px;
        }
        
        .items-grid::-webkit-scrollbar-thumb {
            background: var(--gray-400);
            border-radius: 4px;
        }
        
        .items-grid::-webkit-scrollbar-thumb:hover {
            background: var(--gray-500);
        }
        
        .item-card {
            background: white;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }
        
        .item-card:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }
        
        .item-name {
            font-weight: 700;
            margin-bottom: var(--spacing-sm);
        }
        
        .item-price {
            font-size: 1.5rem;
            color: var(--primary);
            font-weight: 700;
        }
        
        .cart-sidebar {
            background: white;
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
            height: 100%;
            overflow: auto;
            position: relative;
            transition: all 0.3s ease;
        }
        
        .cart-sidebar.collapsed {
            padding: var(--spacing-md);
            width: 60px;
        }
        
        .cart-sidebar.collapsed .cart-content {
            display: none;
        }
        
        .cart-content {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: visible;
        }
        
        .cart-toggle {
            position: absolute;
            top: var(--spacing-md);
            right: var(--spacing-md);
            background: var(--primary);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            z-index: 10;
            transition: all 0.3s;
            box-shadow: var(--shadow-md);
        }
        
        .cart-toggle:hover {
            background: var(--primary-dark);
            transform: scale(1.1);
        }
        
        .cart-sidebar.collapsed .cart-toggle {
            position: static;
            margin: 0 auto;
        }

        
        .cart-sidebar.collapsed {
            padding: var(--spacing-md);
            width: 60px;
        }
        
        .cart-sidebar.collapsed .cart-content {
            display: none;
        }
        
        .cart-toggle {
            position: absolute;
            top: var(--spacing-md);
            right: var(--spacing-md);
            background: var(--primary);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            z-index: 10;
            transition: all 0.3s;
        }
        
        .cart-toggle:hover {
            background: var(--primary-dark);
            transform: scale(1.1);
        }
        
        .cart-sidebar.collapsed .cart-toggle {
            position: static;
            margin: 0 auto;
        }
        
        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding-right: var(--spacing-sm);
            min-height: 300px;
            margin-top: var(--spacing-md);
        }
        
        .cart-items::-webkit-scrollbar {
            width: 6px;
        }
        
        .cart-items::-webkit-scrollbar-track {
            background: var(--gray-100);
            border-radius: 3px;
        }
        
        .cart-items::-webkit-scrollbar-thumb {
            background: var(--gray-400);
            border-radius: 3px;
        }
        
        .cart-items::-webkit-scrollbar-thumb:hover {
            background: var(--gray-500);
        }
        
        .cart-items::-webkit-scrollbar {
            width: 6px;
        }
        
        .cart-items::-webkit-scrollbar-track {
            background: var(--gray-100);
            border-radius: 3px;
        }
        
        .cart-items::-webkit-scrollbar-thumb {
            background: var(--gray-400);
            border-radius: 3px;
        }
        
        .cart-items::-webkit-scrollbar-thumb:hover {
            background: var(--gray-500);
        }
        
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-md);
            background: var(--gray-50);
            border-radius: var(--radius);
            margin-bottom: var(--spacing-sm);
        }
        
        .cart-total {
            font-size: 1.5rem;
            font-weight: 700;
            padding: var(--spacing-lg);
            background: var(--gray-50);
            border-radius: var(--radius);
            text-align: right;
        }
        
        /* ============================================
           TABLE
           ============================================ */
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        
        th {
            background: var(--gray-100);
            padding: var(--spacing-md);
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid var(--gray-200);
        }
        
        td {
            padding: var(--spacing-md);
            border-bottom: 1px solid var(--gray-200);
        }
        
        tr:hover {
            background: var(--gray-50);
        }
        
        /* ============================================
           UTILITIES
           ============================================ */
        .hidden {
            display: none !important;
        }
        
        .text-center {
            text-align: center;
        }
        
        .text-muted {
            color: var(--text-secondary);
        }
        
        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .badge-success {
            background: #dcfce7;
            color: var(--success);
        }
        
        .badge-warning {
            background: #fef3c7;
            color: var(--warning);
        }
        
        .badge-danger {
            background: #fee2e2;
            color: var(--danger);
        }
        
        .badge-primary {
            background: #ddd6fe;
            color: var(--primary);
        }
        
        .badge-info {
            background: #dbeafe;
            color: var(--info);
        }
        
        /* ============================================
           LOGIN PAGE
           ============================================ */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .login-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl) * 2;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        
        .login-logo {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: var(--spacing-xl);
            color: var(--primary);
        }
        
        /* ============================================
           KDS (Kitchen Display System)
           ============================================ */
        .kds-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: var(--spacing-lg);
        }
        
        .order-card {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: var(--spacing-xl);
            border-left: 4px solid var(--warning);
        }
        
        .order-card.preparing {
            border-left-color: var(--info);
        }
        
        .order-card.ready {
            border-left-color: var(--success);
        }
        
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
            padding-bottom: var(--spacing-md);
            border-bottom: 2px solid var(--gray-200);
        }
        
        .order-time {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--danger);
        }
        
        .order-items-list {
            margin-bottom: var(--spacing-lg);
        }
        
        .order-item-line {
            display: flex;
            justify-content: space-between;
            padding: var(--spacing-sm) 0;
        }
        
        /* ============================================
           MODAL
           ============================================ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        
        .modal-content {
            background: white;
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
            padding-bottom: var(--spacing-md);
            border-bottom: 2px solid var(--gray-200);
        }
        
        .modal-close {
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
        }
        
        .modal-close:hover {
            color: var(--danger);
        }
        
        /* ============================================
           CUSTOMIZATION MODAL
           ============================================ */
        .customization-section {
            margin-bottom: var(--spacing-lg);
            padding: var(--spacing-md);
            background: var(--gray-50);
            border-radius: var(--radius);
        }
        
        .customization-section h4 {
            margin-bottom: var(--spacing-md);
            color: var(--text-primary);
        }
        
        .topping-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: var(--spacing-sm);
        }
        
        .topping-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-sm);
            background: white;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .topping-item:hover {
            border-color: var(--primary);
        }
        
        .topping-item.selected {
            border-color: var(--primary);
            background: rgba(102, 126, 234, 0.1);
        }
        
        .topping-item input[type="checkbox"] {
            cursor: pointer;
        }
        
        .sauce-selector {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-sm);
        }
        
        .sauce-option {
            padding: var(--spacing-md);
            background: white;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .sauce-option:hover {
            border-color: var(--primary);
        }
        
        .sauce-option.selected {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }
        
        /* ============================================
           RESPONSIVE DESIGN - MOBILE & TABLET
           ============================================ */
        
        /* Tablets (iPad, Android tablets) */
        @media (max-width: 1024px) {
            :root {
                --sidebar-width: 220px;
                --grid-gap: 1rem;
            }
            
            .main-content {
                margin-left: 220px;
                padding: var(--spacing-lg);
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .pos-layout {
                grid-template-columns: 1fr;
                height: auto;
            }
            
            .pos-items-container {
                height: auto;
                max-height: 50vh;
            }
            
            .cart-sidebar {
                height: auto !important;
                min-height: 500px;
                max-height: 70vh;
                overflow: visible !important;
            }
            
            .cart-sidebar .cart-content {
                display: flex !important;
                flex-direction: column;
                height: 100%;
                overflow: visible;
            }
            
            .cart-sidebar .cart-items {
                flex: 1;
                overflow-y: auto;
                max-height: 200px;
            }
            
            .cart-sidebar.collapsed .cart-content {
                display: none !important;
            }
            
            .pos-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }
            
            .kds-grid {
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            }
            
            .topping-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
        
        /* Mobile devices (phones) */
        @media (max-width: 768px) {
            :root {
                --spacing-md: 0.75rem;
                --spacing-lg: 1rem;
                --spacing-xl: 1.25rem;
            }
            
            .mobile-header {
                display: flex;
            }
            
            .sidebar {
                transform: translateX(-100%);
            }
            
            .sidebar.mobile-visible {
                transform: translateX(0);
            }
            
            .main-content {
                margin-left: 0;
                margin-top: var(--header-height);
                padding: var(--spacing-md);
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
                gap: var(--spacing-md);
            }
            
            .pos-layout {
                grid-template-columns: 1fr;
                height: auto;
                gap: var(--spacing-md);
            }
            
            .pos-layout.cart-collapsed {
                grid-template-columns: 1fr;
            }
            
            .pos-items-container {
                height: auto;
                max-height: 60vh;
            }
            
            .cart-sidebar {
                height: auto;
                max-height: 50vh;
            }
            
            .cart-sidebar.collapsed {
                width: 100%;
                height: 60px;
            }
            
            .pos-container {
                flex-direction: column;
            }
            
            .pos-items {
                width: 100%;
                margin-bottom: var(--spacing-md);
            }
            
            .pos-cart {
                width: 100%;
                position: static;
            }
            
            .pos-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: var(--spacing-sm);
            }
            
            .pos-item {
                padding: var(--spacing-sm);
                font-size: 0.875rem;
            }
            
            .kds-grid {
                grid-template-columns: 1fr;
                gap: var(--spacing-md);
            }
            
            .order-card {
                padding: var(--spacing-md);
            }
            
            .modal-content {
                width: 95%;
                padding: var(--spacing-md);
                max-height: 85vh;
            }
            
            .modal-header h2 {
                font-size: 1.25rem;
            }
            
            .topping-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
            
            .btn {
                padding: var(--spacing-sm) var(--spacing-md);
                font-size: 0.875rem;
            }
            
            .card {
                padding: var(--spacing-md);
                margin-bottom: var(--spacing-md);
            }
            
            table {
                font-size: 0.875rem;
            }
            
            .form-group {
                margin-bottom: var(--spacing-md);
            }
        }
        
        /* Small phones */
        @media (max-width: 480px) {
            .pos-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .topping-grid {
                grid-template-columns: 1fr;
            }
            
            .sauce-selector {
                flex-direction: column;
            }
            
            .modal-content {
                width: 100%;
                max-height: 100vh;
                border-radius: 0;
            }
            
            .btn-group {
                flex-direction: column;
                width: 100%;
            }
            
            .btn-group .btn {
                width: 100%;
            }
        }
        
        /* Touch device optimizations (iOS & Android) */
        @media (hover: none) and (pointer: coarse) {
            /* Larger touch targets */
            .btn {
                min-height: 44px;
                padding: var(--spacing-md) var(--spacing-lg);
            }
            
            .nav-item {
                min-height: 48px;
            }
            
            .pos-item {
                min-height: 80px;
            }
            
            .topping-item {
                min-height: 48px;
                padding: var(--spacing-md);
            }
            
            .sauce-option {
                min-height: 48px;
                padding: var(--spacing-md) var(--spacing-lg);
            }
            
            /* Remove hover effects on touch devices */
            .btn:hover,
            .nav-item:hover,
            .pos-item:hover,
            .topping-item:hover,
            .sauce-option:hover {
                transform: none;
            }
            
            /* Active states for touch feedback */
            .btn:active {
                transform: scale(0.97);
            }
            
            .pos-item:active {
                transform: scale(0.95);
            }
            
            /* Disable text selection on interactive elements */
            .btn, .pos-item, .nav-item, .topping-item, .sauce-option {
                -webkit-user-select: none;
                user-select: none;
                -webkit-tap-highlight-color: transparent;
            }
        }
        
        /* Landscape orientation on mobile */
        @media (max-width: 768px) and (orientation: landscape) {
            .mobile-header {
                height: 48px;
            }
            
            .main-content {
                margin-top: 48px;
            }
            
            .pos-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
            
            .kds-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        /* iOS specific fixes */
        @supports (-webkit-touch-callout: none) {
            /* Safe area for iPhone notch */
            .mobile-header {
                padding-top: env(safe-area-inset-top);
                height: calc(var(--header-height) + env(safe-area-inset-top));
            }
            
            .main-content {
                padding-bottom: env(safe-area-inset-bottom);
            }
            
            .sidebar {
                padding-top: calc(var(--spacing-lg) + env(safe-area-inset-top));
            }
            
            /* Fix for iOS input zoom */
            input[type="text"],
            input[type="number"],
            input[type="email"],
            input[type="password"],
            select,
            textarea {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Container Principal -->
    <div id="app"></div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        // ============================================
        // CONFIGURATION FIREBASE
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyA-3cyKsOJ-SB23bSEtbh1anAt-mB0htLs",
            authDomain: "thaigest.firebaseapp.com",
            projectId: "thaigest",
            storageBucket: "thaigest.firebasestorage.app",
            messagingSenderId: "738590645148",
            appId: "1:738590645148:web:bc60f86c5121fb46a74659",
            measurementId: "G-LLBPYH4ZN6"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        // ============================================
        // STATE GLOBAL
        // ============================================
        let currentUser = null;
        let currentPage = 'login';
        let cart = [];
        let allItems = [];
        let outOfStockItems = {}; // { itemId: { name, type, reportedBy, reportedAt } }
        let outOfStockUnsubscribe = null;
        
        // ============================================
        // ROUTING & RENDERING
        // ============================================
        function renderApp() {
            const app = document.getElementById('app');
            
            if (!currentUser) {
                app.innerHTML = renderLoginPage();
                return;
            }
            
            app.innerHTML = `
                <div class="app-container">
                    <!-- Mobile Header -->
                    <div class="mobile-header">
                        <button class="hamburger-btn" onclick="toggleMobileSidebar()">☰</button>
                        <h1>🍽️ GestionResto</h1>
                    </div>
                    
                    <!-- Sidebar Overlay -->
                    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleMobileSidebar()"></div>
                    
                    ${renderSidebar()}
                    <main class="main-content" id="mainContent">
                        ${renderCurrentPage()}
                    </main>
                </div>
            `;
            
            // Restaurer l'état de la sidebar après le rendu
            setTimeout(() => restoreSidebarState(), 50);
            
            attachEventListeners();
        }
        
        function renderSidebar() {
            const permissions = currentUser.permissions || {};
            const isAdmin = currentUser.role === 'admin';
            
            // Fonction helper pour vérifier l'accès
            const hasAccess = (page) => isAdmin || permissions[page];
            
            return `
                <nav class="sidebar" id="sidebar">
                    <button class="sidebar-toggle" onclick="toggleSidebar()" title="Réduire/Agrandir">
                        <span id="sidebarToggleIcon">‹</span>
                    </button>
                    <div class="sidebar-logo">🍽️ GestionResto</div>
                    ${hasAccess('dashboard') ? `
                    <div class="nav-item ${currentPage === 'dashboard' ? 'active' : ''}" onclick="navigateTo('dashboard')">
                        📊 Dashboard
                    </div>
                    ` : ''}
                    ${hasAccess('pos') ? `
                    <div class="nav-item ${currentPage === 'pos' ? 'active' : ''}" onclick="navigateTo('pos')">
                        💳 Point de Vente
                    </div>
                    ` : ''}
                    ${hasAccess('kds') ? `
                    <div class="nav-item ${currentPage === 'kds' ? 'active' : ''}" onclick="navigateTo('kds')">
                        🍳 Cuisine (KDS)
                    </div>
                    ` : ''}
                    ${hasAccess('payments') ? `
                    <div class="nav-item ${currentPage === 'payments' ? 'active' : ''}" onclick="navigateTo('payments')">
                        💰 Paiements
                    </div>
                    ` : ''}
                    ${hasAccess('items') ? `
                    <div class="nav-item ${currentPage === 'items' ? 'active' : ''}" onclick="navigateTo('items')">
                        📦 Articles
                    </div>
                    ` : ''}
                    ${hasAccess('stock') ? `
                    <div class="nav-item ${currentPage === 'stock' ? 'active' : ''}" onclick="navigateTo('stock')">
                        📊 Stock
                    </div>
                    ` : ''}
                    ${hasAccess('recipes') ? `
                    <div class="nav-item ${currentPage === 'recipes' ? 'active' : ''}" onclick="navigateTo('recipes')">
                        📖 Recettes (BOM)
                    </div>
                    ` : ''}
                    ${hasAccess('reports') ? `
                    <div class="nav-item ${currentPage === 'reports' ? 'active' : ''}" onclick="navigateTo('reports')">
                        📈 Rapports
                    </div>
                    ` : ''}
                    ${isAdmin ? `
                    <div class="nav-item ${currentPage === 'users' ? 'active' : ''}" onclick="navigateTo('users')">
                        👥 Création d'accès
                    </div>
                    ` : ''}
                    <div style="margin-top: auto; padding-top: var(--spacing-xl); border-top: 1px solid rgba(255,255,255,0.1);">
                        <div style="color: white; margin-bottom: var(--spacing-md);">
                            <div style="font-weight: 600;">${currentUser.name}</div>
                            <div style="font-size: 0.875rem; opacity: 0.7;">${currentUser.role}</div>
                        </div>
                        <button class="btn btn-sm" style="width: 100%;" onclick="logout()">Déconnexion</button>
                    </div>
                </nav>
            `;
        }
        
        function renderCurrentPage() {
            switch(currentPage) {
                case 'dashboard': return renderDashboard();
                case 'pos': return renderPOS();
                case 'kds': return renderKDS();
                case 'payments': return renderPayments();
                case 'items': return renderItems();
                case 'stock': return renderStock();
                case 'recipes': return renderRecipes();
                case 'reports': return renderReports();
                case 'users': return renderUsers();
                default: return renderDashboard();
            }
        }
        
        // ============================================
        // LOGIN PAGE
        // ============================================
        function renderLoginPage() {
            return `
                <div class="login-container">
                    <div class="login-card">
                        <h1 class="login-logo">🍽️ GestionResto</h1>
                        <form onsubmit="handleLogin(event)">
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" id="email" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label>Mot de passe</label>
                                <input type="password" id="password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary" style="width: 100%;">
                                Connexion
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }
        
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const userDoc = await db.collection('users').doc(userCredential.user.uid).get();
                
                if (!userDoc.exists || !userDoc.data().active) {
                    alert('Compte inactif');
                    await auth.signOut();
                    return;
                }
                
                currentUser = { uid: userCredential.user.uid, ...userDoc.data() };
                currentPage = 'dashboard';
                renderApp();
            } catch (error) {
                alert('Erreur de connexion: ' + error.message);
            }
        }
        
        async function logout() {
            await auth.signOut();
            currentUser = null;
            currentPage = 'login';
            renderApp();
        }
        
        // ============================================
        // DASHBOARD
        // ============================================
        function renderDashboard() {
            loadDashboardStats();
            return `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-xl);">
                    <div>
                        <h1>📊 Dashboard</h1>
                        <p class="text-muted">Vue d'ensemble de votre activité</p>
                    </div>
                    <div style="display: flex; gap: var(--spacing-sm);">
                        <button class="btn btn-sm" onclick="filterDashboard('today')" id="filterToday">📅 Aujourd'hui</button>
                        <button class="btn btn-sm btn-secondary" onclick="filterDashboard('week')" id="filterWeek">📅 Cette semaine</button>
                        <button class="btn btn-sm btn-secondary" onclick="filterDashboard('month')" id="filterMonth">📅 Ce mois</button>
                        <button class="btn btn-sm btn-secondary" onclick="filterDashboard('all')" id="filterAll">📅 Tout</button>
                    </div>
                </div>
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label" id="statRevenueLabel">Chiffre d'affaires du jour</div>
                        <div class="stat-value" id="statRevenue">0 F</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label" id="statOrdersLabel">Commandes du jour</div>
                        <div class="stat-value" id="statOrders">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Ticket moyen</div>
                        <div class="stat-value" id="statAvg">0 F</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Tables actives</div>
                        <div class="stat-value" id="statTables">0</div>
                    </div>
                </div>
                
                <div class="card">
                    <h3 id="recentOrdersTitle">Commandes récentes</h3>
                    <div id="recentOrders">Chargement...</div>
                </div>
            `;
        }
        
        let currentDashboardFilter = 'today';
        
        function filterDashboard(period) {
            currentDashboardFilter = period;
            
            // Mettre à jour les boutons
            ['filterToday', 'filterWeek', 'filterMonth', 'filterAll'].forEach(id => {
                const btn = document.getElementById(id);
                if (btn) {
                    btn.className = id === 'filter' + period.charAt(0).toUpperCase() + period.slice(1) 
                        ? 'btn btn-sm' 
                        : 'btn btn-sm btn-secondary';
                }
            });
            
            loadDashboardStats(period);
        }
        
        async function loadDashboardStats(period = 'today') {
            let startDate = new Date();
            let periodLabel = '';
            
            switch(period) {
                case 'today':
                    startDate.setHours(0, 0, 0, 0);
                    periodLabel = 'du jour';
                    break;
                case 'week':
                    const day = startDate.getDay();
                    const diff = startDate.getDate() - day + (day === 0 ? -6 : 1);
                    startDate = new Date(startDate.setDate(diff));
                    startDate.setHours(0, 0, 0, 0);
                    periodLabel = 'de la semaine';
                    break;
                case 'month':
                    startDate = new Date(startDate.getFullYear(), startDate.getMonth(), 1);
                    startDate.setHours(0, 0, 0, 0);
                    periodLabel = 'du mois';
                    break;
                case 'all':
                    startDate = new Date(2020, 0, 1);
                    periodLabel = 'total';
                    break;
            }
            
            let query = db.collection('orders');
            if (period !== 'all') {
                query = query.where('createdAt', '>=', startDate);
            }
            
            const ordersSnap = await query.get();
            
            let totalRevenue = 0;
            let orderCount = 0;
            const activeTables = new Set();
            
            ordersSnap.docs.forEach(doc => {
                const data = doc.data();
                if (data.total) totalRevenue += data.total;
                orderCount++;
                if (data.status === 'pending') activeTables.add(data.tableNumber);
            });
            
            const avgTicket = orderCount > 0 ? Math.round(totalRevenue / orderCount) : 0;
            
            setTimeout(() => {
                document.getElementById('statRevenueLabel').textContent = `Chiffre d'affaires ${periodLabel}`;
                document.getElementById('statOrdersLabel').textContent = `Commandes ${periodLabel}`;
                document.getElementById('statRevenue').textContent = `${totalRevenue.toLocaleString()} F`;
                document.getElementById('statOrders').textContent = orderCount;
                document.getElementById('statAvg').textContent = `${avgTicket.toLocaleString()} F`;
                document.getElementById('statTables').textContent = activeTables.size;
            }, 100);
            
            loadRecentOrders(period);
        }
        
        async function loadRecentOrders(period = 'today') {
            let query = db.collection('orders')
                .orderBy('createdAt', 'desc');
            
            if (period === 'today') {
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                query = query.where('createdAt', '>=', today);
            } else if (period === 'week') {
                const startDate = new Date();
                const day = startDate.getDay();
                const diff = startDate.getDate() - day + (day === 0 ? -6 : 1);
                const weekStart = new Date(startDate.setDate(diff));
                weekStart.setHours(0, 0, 0, 0);
                query = query.where('createdAt', '>=', weekStart);
            } else if (period === 'month') {
                const monthStart = new Date();
                monthStart.setDate(1);
                monthStart.setHours(0, 0, 0, 0);
                query = query.where('createdAt', '>=', monthStart);
            }
            
            const snapshot = await query.limit(20).get();
            
            const container = document.getElementById('recentOrders');
            
            if (snapshot.empty) {
                container.innerHTML = '<p class="text-muted">Aucune commande récente</p>';
                return;
            }
            
            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Table</th>
                            <th>Établissement</th>
                            <th>Montant</th>
                            <th>Statut</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${snapshot.docs.map(doc => {
                            const order = doc.data();
                            const statusBadge = order.status === 'pending' ? 'badge-warning' : 
                                              order.status === 'paid' ? 'badge-success' : 'badge-danger';
                            const statusText = order.status === 'pending' ? 'En attente' :
                                             order.status === 'paid' ? 'Payée' : 'Annulée';
                            const date = order.createdAt ? new Date(order.createdAt.toDate()).toLocaleString() : 'N/A';
                            
                            return `
                                <tr>
                                    <td><strong>Table ${order.tableNumber}</strong></td>
                                    <td>${order.establishmentId || 'N/A'}</td>
                                    <td><strong>${(order.total || 0).toLocaleString()} F</strong></td>
                                    <td><span class="badge ${statusBadge}">${statusText}</span></td>
                                    <td>${date}</td>
                                    <td>
                                        <button class="btn btn-sm btn-danger" onclick="deleteOrder('${doc.id}')" title="Supprimer la commande">
                                            🗑️
                                        </button>
                                    </td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;
        }
        
        async function deleteOrder(orderId) {
            if (!confirm('⚠️ Êtes-vous sûr de vouloir supprimer cette commande ?\n\nCette action est irréversible.')) {
                return;
            }
            
            try {
                await db.collection('orders').doc(orderId).delete();
                alert('✅ Commande supprimée avec succès !');
                
                // Recharger les statistiques et la liste
                loadDashboardStats(currentDashboardFilter);
            } catch (error) {
                console.error('Erreur suppression commande:', error);
                alert('❌ Erreur: ' + error.message);
            }
        }
        
        // ============================================
        // KDS (KITCHEN DISPLAY SYSTEM)
        // ============================================
        function renderKDS() {
            const savedEstablishment = localStorage.getItem('currentKDSEstablishment') || '';
            loadKDSOrders(savedEstablishment);
            
            return `
                <h1>🍳 Cuisine - Affichage des Commandes</h1>
                
                <div style="display: flex; gap: var(--spacing-md); margin-bottom: var(--spacing-xl); align-items: center;">
                    <select id="kdsEstablishment" class="form-control" style="max-width: 300px;" onchange="loadKDSOrders(this.value)">
                        <option value="" ${savedEstablishment === '' ? 'selected' : ''}>Tous les établissements</option>
                        <option value="Le_Sha" ${savedEstablishment === 'Le_Sha' ? 'selected' : ''}>Le Sha</option>
                        <option value="Le_Shiba" ${savedEstablishment === 'Le_Shiba' ? 'selected' : ''}>Le Shiba</option>
                    </select>
                    
                    <select id="kdsStatusFilter" class="form-control" style="max-width: 200px;" onchange="loadKDSOrders()">
                        <option value="active">Commandes actives</option>
                        <option value="pending">En attente</option>
                        <option value="preparing">En préparation</option>
                        <option value="ready">Prêtes</option>
                        <option value="all">Toutes</option>
                    </select>
                    
                    <button class="btn btn-sm" onclick="loadKDSOrders()">🔄 Actualiser</button>
                    
                    <button class="btn btn-sm btn-warning" onclick="showOutOfStockManager()">
                        🚫 Gérer les ruptures
                    </button>
                    
                    <div style="margin-left: auto; font-size: 0.875rem; color: var(--text-secondary);">
                        <span id="kdsCount">0</span> commande(s)
                    </div>
                </div>
                
                <div class="kds-grid" id="kdsGrid">
                    <p class="text-muted text-center">Chargement...</p>
                </div>
            `;
        }
        
        let kdsUnsubscribe = null;
        
        async function loadKDSOrders(establishment) {
            // Désabonner l'ancien listener
            if (kdsUnsubscribe) {
                kdsUnsubscribe();
            }
            
            // Sauvegarder la sélection
            if (establishment !== undefined) {
                localStorage.setItem('currentKDSEstablishment', establishment);
            }
            
            const statusFilter = document.getElementById('kdsStatusFilter')?.value || 'active';
            
            let query = db.collection('orders');
            
            // Filtrer par établissement si spécifié
            if (establishment) {
                query = query.where('establishmentId', '==', establishment);
            }
            
            // Filtrer par statut
            if (statusFilter === 'active') {
                query = query.where('status', 'in', ['pending', 'preparing', 'ready']);
            } else if (statusFilter !== 'all') {
                query = query.where('status', '==', statusFilter);
            }
            
            // Pas de orderBy pour éviter les erreurs d'index
            
            // Listener en temps réel
            kdsUnsubscribe = query.onSnapshot(snapshot => {
                let orders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                // Filtrer les commandes actives si nécessaire
                if (statusFilter === 'active') {
                    orders = orders.filter(o => ['pending', 'preparing', 'ready'].includes(o.status));
                }
                
                renderKDSCards(orders);
            });
        }
        
        function renderKDSCards(orders) {
            const grid = document.getElementById('kdsGrid');
            const countEl = document.getElementById('kdsCount');
            
            if (!grid) return;
            
            if (countEl) countEl.textContent = orders.length;
            
            if (orders.length === 0) {
                grid.innerHTML = '<p class="text-muted text-center" style="grid-column: 1 / -1;">Aucune commande en cours</p>';
                return;
            }
            
            // Trier par date
            orders.sort((a, b) => {
                const aTime = a.createdAt?.toDate() || new Date();
                const bTime = b.createdAt?.toDate() || new Date();
                return aTime - bTime;
            });
            
            grid.innerHTML = orders.map(order => {
                const elapsedMinutes = order.createdAt 
                    ? Math.floor((new Date() - order.createdAt.toDate()) / 60000)
                    : 0;
                
                const statusClass = order.status === 'preparing' ? 'preparing' : 
                                   order.status === 'ready' ? 'ready' : '';
                
                const statusText = order.status === 'preparing' ? '👨‍🍳 En préparation' :
                                  order.status === 'ready' ? '✅ Prêt' : '⏳ Nouvelle commande';
                
                const statusBadge = order.status === 'preparing' ? 'badge-info' :
                                   order.status === 'ready' ? 'badge-success' : 'badge-warning';
                
                const timeColor = elapsedMinutes > 15 ? 'var(--danger)' : 
                                 elapsedMinutes > 10 ? 'var(--warning)' : 'var(--text-secondary)';
                
                return `
                    <div class="order-card ${statusClass}">
                        <div class="order-header">
                            <div>
                                <h2 style="margin: 0;">Table ${order.tableNumber}</h2>
                                <span class="badge ${statusBadge}">${statusText}</span>
                                <div class="text-muted" style="font-size: 0.875rem; margin-top: 0.25rem;">${order.establishmentId}</div>
                            </div>
                            <div class="order-time" style="color: ${timeColor};">${elapsedMinutes}min</div>
                        </div>
                        
                        <div class="order-items-list">
                            ${order.items.map(item => `
                                <div class="order-item-line">
                                    <span><strong style="color: var(--primary); font-size: 1.1rem;">×${item.quantity}</strong> ${item.itemName}</span>
                                    ${item.customization ? `
                                        <div class="text-muted" style="font-size: 0.75rem; margin-left: 1.5rem; margin-top: 0.25rem;">
                                            ${item.customization.toppings?.length > 0 ? `🧀 + ${item.customization.toppings.join(', ')}` : ''}
                                            ${item.customization.sauce ? `<br>🥫 ${item.customization.sauce}` : ''}

        async function cancelOrder(orderId, tableNumber) {
            const reason = prompt(`Annuler la commande de la Table ${tableNumber}?\n\nRaison (optionnel):`);
            
            if (reason === null) return; // User cancelled
            
            if (!confirm(`Confirmer l'annulation de la Table ${tableNumber} ?`)) return;
            
            try {
                await db.collection('orders').doc(orderId).update({
                    status: 'cancelled',
                    cancelledAt: firebase.firestore.FieldValue.serverTimestamp(),
                    cancelledBy: currentUser.uid,
                    cancellationReason: reason || 'Non spécifié'
                });
                
                alert('✅ Commande annulée');
            } catch (error) {
                alert('❌ Erreur: ' + error.message);
            }
        }

        async function markOutOfStock(itemId, itemName, type) {
            if (!confirm(`Marquer "${itemName}" en rupture ?`)) {
                return;
            }
            
            try {
                await db.collection('outOfStock').doc(itemId).set({
                    itemId: itemId,
                    itemName: itemName,
                    type: type,
                    reportedBy: currentUser.uid,
                    reportedByName: currentUser.name,
                    reportedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    resolved: false
                });
                
                alert('✅ Article marqué en rupture. Les serveurs seront alertés.');
                closeOutOfStockModal();
                showOutOfStockManager(); // Recharger
                
            } catch (error) {
                console.error('Erreur marquage rupture:', error);
                alert('❌ Erreur: ' + error.message);
            }
        }
        
        function filterOutOfStockList() {
            const searchTerm = document.getElementById('searchOutOfStock')?.value.toLowerCase() || '';
            
            // Parcourir tous les items dans chaque section
            ['articles', 'toppings', 'sauces'].forEach(section => {
                const container = document.querySelector(`.out-items-${section}`);
                const sectionHeader = document.querySelector(`.out-section-${section}`);
                
                if (!container) return;
                
                const items = container.querySelectorAll('[style*="display: flex"]');
                let visibleCount = 0;
                
                items.forEach(item => {
                    const text = item.textContent.toLowerCase();
                    if (text.includes(searchTerm)) {
                        item.style.display = 'flex';
                        visibleCount++;
                    } else {
                        item.style.display = 'none';
                    }
                });
                
                // Masquer la section si aucun item visible
                if (sectionHeader) {
                    sectionHeader.style.display = visibleCount > 0 ? 'block' : 'none';
                }
                if (container) {
                    container.style.display = visibleCount > 0 ? 'block' : 'none';
                }
            });
        }

            } catch (error) {
                console.error('Erreur résolution rupture:', error);
                alert('❌ Erreur: ' + error.message);
            }
        }

        async function loadPOSItems() {
            const snapshot = await db.collection('items')
                .where('active', '==', true)
                .where('type', '==', 'finished')
                .get();
            
            allItems = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            
            // Extraire les catégories uniques
            const categories = [...new Set(allItems.map(item => item.category).filter(Boolean))];
            const categoryFilter = document.getElementById('categoryFilter');
            if (categoryFilter) {
                categoryFilter.innerHTML = '<option value="">Toutes catégories</option>' +
                    categories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
            }
            
            renderPOSItems(allItems);
            
            // Restaurer l'état du cart (replié/déplié)
            setTimeout(() => restoreCartState(), 100);
            
            // Écouter les ruptures de stock en temps réel
            if (outOfStockUnsubscribe) {
                outOfStockUnsubscribe();
            }
            outOfStockUnsubscribe = db.collection('outOfStock').onSnapshot(snapshot => {
                outOfStockItems = {};
                snapshot.docs.forEach(doc => {
                    outOfStockItems[doc.id] = doc.data();
                });
                updateOutOfStockBadge();
            });
        }

                return;

            grid.innerHTML = items.map(item => {
                const isOutOfStock = outOfStockItems[item.id];

        function filterPOSItems() {
            const search = document.getElementById('searchItems').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const establishment = document.getElementById('establishmentFilter')?.value || '';
            
            const filtered = allItems.filter(item => {
                const matchSearch = item.name.toLowerCase().includes(search) ||
                                   (item.category && item.category.toLowerCase().includes(search));
                const matchCategory = !category || item.category === category;
                const matchEstablishment = !establishment || 
                    (item.establishments && item.establishments.includes(establishment));
                return matchSearch && matchCategory && matchEstablishment;
            });
            renderPOSItems(filtered);
        }

        function toggleTopping(toppingId) {
            const checkbox = document.getElementById(`topping-${toppingId}`);
            const toppingDiv = checkbox.closest('.topping-item');
            
            if (selectedToppings.includes(toppingId)) {
                selectedToppings = selectedToppings.filter(id => id !== toppingId);
                checkbox.checked = false;
                toppingDiv.classList.remove('selected');
            } else {
                selectedToppings.push(toppingId);
                checkbox.checked = true;
                toppingDiv.classList.add('selected');
            }
            
            updateCustomizationPrice();
        }
        
        function selectSauce(sauceId) {
            selectedSauce = sauceId;
            
            // Update UI
            document.querySelectorAll('.sauce-option').forEach(el => {
                el.classList.remove('selected');
            });
            event.target.classList.add('selected');
        }
        
        function updateCustomizationPrice() {
            if (!currentCustomizingItem) return;
            
            let total = currentCustomizingItem.price;
            
            selectedToppings.forEach(toppingId => {
                const topping = availableToppings.find(t => t.id === toppingId);
                if (topping) total += topping.price;
            });
            
            const totalPriceEl = document.getElementById('totalPrice');
            if (totalPriceEl) {
                totalPriceEl.textContent = total.toLocaleString() + ' F';
            }
        }
        
        function addCustomizedToCart() {
            if (!currentCustomizingItem) return;
            
            const customizedItem = { ...currentCustomizingItem };
            
            // Calculate final price with toppings
            let finalPrice = customizedItem.price;
            const toppingDetails = [];
            
            selectedToppings.forEach(toppingId => {
                const topping = availableToppings.find(t => t.id === toppingId);
                if (topping) {
                    finalPrice += topping.price;
                    toppingDetails.push(topping.name);
                }
            });
            
            // Build customization summary
            const customization = {
                toppings: toppingDetails,
                sauce: selectedSauce ? availableSauces.find(s => s.id === selectedSauce)?.name : null,
                notes: customNotes
            };
            
            // Create display name
            let displayName = customizedItem.name;
            if (toppingDetails.length > 0) {
                displayName += ` + ${toppingDetails.join(', ')}`;
            }
            if (customization.sauce) {
                displayName += ` (${customization.sauce})`;
            }
            
            // Add to cart with customization
            const cartItem = {
                ...customizedItem,
                price: finalPrice,
                originalPrice: customizedItem.price,
                customization: customization,
                displayName: displayName
            };
            
            addToCart(cartItem);
            closeCustomizationModal();
        }
        
        function closeCustomizationModal() {
            const modal = document.getElementById('customizationModal');
            if (modal) {
                modal.remove();

            currentCustomizingItem = null;
            selectedToppings = [];
            selectedSauce = null;
            customNotes = '';

        function addToCart(item) {
            // Check if same item with same customization exists
            const existingIndex = cart.findIndex(c => 
                c.id === item.id && 
                JSON.stringify(c.customization) === JSON.stringify(item.customization)
            );
            
            if (existingIndex >= 0) {
                cart[existingIndex].quantity++;
            } else {
                cart.push({ ...item, quantity: 1 });
            }
            renderCart();
        }
        
        function renderCart() {
            const container = document.getElementById('cartItems');
            
            if (cart.length === 0) {
                container.innerHTML = '<p class="text-muted text-center">Panier vide</p>';
                document.getElementById('cartSubtotal').textContent = '0 F';
                document.getElementById('cartTax').textContent = '0 F';
                document.getElementById('cartTotal').textContent = '0 F';
                return;
            }
            
            container.innerHTML = cart.map((item, index) => {
                const displayName = item.displayName || item.name;
                const customInfo = item.customization ? `
                    <div class="text-muted" style="font-size: 0.75rem; margin-top: 0.25rem;">
                        ${item.customization.toppings?.length > 0 ? `+ ${item.customization.toppings.join(', ')}` : ''}
                        ${item.customization.sauce ? ` • ${item.customization.sauce}` : ''}
                        ${item.customization.notes ? `<br>📝 ${item.customization.notes}` : ''}
                    </div>
                ` : '';
                
                return `
                    <div class="cart-item">
                        <div style="flex: 1;">
                            <strong>${displayName}</strong>
                            <div class="text-muted" style="font-size: 0.875rem;">${item.price.toLocaleString()} F × ${item.quantity}</div>
                            ${customInfo}
                        </div>
                        <div style="display: flex; gap: 0.5rem; align-items: center;">
                            <button class="btn btn-sm" onclick="updateCartQty(${index}, -1)">−</button>
                            <span style="font-weight: 700;">${item.quantity}</span>
                            <button class="btn btn-sm" onclick="updateCartQty(${index}, 1)">+</button>
                            <button class="btn btn-sm btn-danger" onclick="removeFromCart(${index})">🗑️</button>
                        </div>
                    </div>
                `;
            }).join('');
            
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const tax = Math.round(subtotal * 0.1);
            const total = subtotal + tax;
            
            document.getElementById('cartSubtotal').textContent = `${subtotal.toLocaleString()} F`;
            document.getElementById('cartTax').textContent = `${tax.toLocaleString()} F`;
            document.getElementById('cartTotal').textContent = `${total.toLocaleString()} F`;
        }
        
        function updateCartQty(index, delta) {
            cart[index].quantity += delta;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
            renderCart();
        }
        
        function removeFromCart(index) {
            cart.splice(index, 1);
            renderCart();

        function clearCart() {

            if (isCollapsed) {

        async function processOrder() {
            const tableNumber = document.getElementById('tableNumber').value;
            const orderNotes = document.getElementById('orderNotes')?.value || '';
            
            if (!tableNumber) {
                alert('Veuillez saisir un numéro de table');
                return;
            }
            
            if (cart.length === 0) {
                alert('Le panier est vide');
                return;
            }
            
            // Déterminer l'établissement automatiquement en fonction des articles
            const establishments = [...new Set(cart.map(item => item.establishmentId).filter(Boolean))];
            let selectedEstablishment = '';
            
            if (establishments.length === 1) {
                // Un seul établissement spécifique
                selectedEstablishment = establishments[0];
            } else if (establishments.length > 1) {
                // Mélange d'établissements - demander à l'utilisateur
                selectedEstablishment = prompt('Articles de plusieurs établissements. Choisir:\n1 = Le Sha\n2 = Le Shiba') === '2' ? 'Le_Shiba' : 'Le_Sha';
            }
            // Sinon reste vide (articles communs aux deux établissements)
            
            try {
                const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                const total = Math.round(subtotal * 1.1);
                
                const orderData = {
                    tableNumber: tableNumber,
                    establishmentId: selectedEstablishment,
                    notes: orderNotes,
                    items: cart.map(item => ({
                        itemId: item.id,
                        itemName: item.displayName || item.name,
                        price: item.price,
                        quantity: item.quantity,
                        components: item.components || [],
                        customization: item.customization || null,
                        originalPrice: item.originalPrice || item.price
                    })),
                    status: 'pending',
                    subtotal: subtotal,
                    total: total,
                    createdBy: currentUser.uid,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                };
                
                // Créer la commande
                const orderRef = await db.collection('orders').add(orderData);
                
                // Déduire les stocks si BOM configuré
                for (const cartItem of cart) {
                    if (cartItem.components && cartItem.components.length > 0) {
                        for (const component of cartItem.components) {
                            const stockQuery = await db.collection('stock')
                                .where('itemId', '==', component.itemId)
                                .where('establishmentId', '==', selectedEstablishment)
                                .get();
                            
                            if (!stockQuery.empty) {
                                const stockDoc = stockQuery.docs[0];
                                const currentStock = stockDoc.data().quantity || 0;
                                const deduction = component.quantity * cartItem.quantity;
                                
                                await stockDoc.ref.update({
                                    quantity: Math.max(0, currentStock - deduction),
                                    lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                                });
                            }
                        }
                    }
                }
                
                alert('✅ Commande enregistrée avec succès !\nTable ' + tableNumber);
                cart = [];
                document.getElementById('tableNumber').value = '';
                if (document.getElementById('orderNotes')) {
                    document.getElementById('orderNotes').value = '';
                }
                renderCart();
            } catch (error) {
                alert('❌ Erreur: ' + error.message);
            }
        }

        async function loadPendingOrders() {
            // Désabonner l'ancien listener
            if (paymentsUnsubscribe) {
                paymentsUnsubscribe();
            }
            
            // Listener en temps réel - SANS orderBy pour éviter l'erreur d'index
            paymentsUnsubscribe = db.collection('orders')
                .where('status', 'in', ['pending', 'preparing', 'ready'])
                .onSnapshot(snapshot => {
                    const container = document.getElementById('tablesList');
                    
                    if (!container) return;
                    
                    if (snapshot.empty) {
                        container.innerHTML = '<p class="text-muted text-center">Aucune commande en attente</p>';
                        return;
                    }
                    
                    // Trier côté client
                    const orders = snapshot.docs
                        .map(doc => ({ id: doc.id, ...doc.data() }))
                        .sort((a, b) => {
                            const aTime = a.createdAt?.toDate() || new Date();
                            const bTime = b.createdAt?.toDate() || new Date();
                            return bTime - aTime;
                        });
                    
                    container.innerHTML = orders.map(order => {
                        const statusBadge = order.status === 'preparing' ? 'badge-info' :
                                           order.status === 'ready' ? 'badge-success' : 'badge-warning';
                        const statusText = order.status === 'preparing' ? '👨‍🍳 En préparation' :
                                          order.status === 'ready' ? '✓ Prêt' : '⏳ En attente';
                        
                        return `
                            <div class="cart-item" onclick="selectOrderForPayment('${order.id}')" style="cursor: pointer;">
                                <div>
                                    <strong>Table ${order.tableNumber}</strong>
                                    <div><span class="badge ${statusBadge}" style="font-size: 0.75rem;">${statusText}</span></div>
                                    <div class="text-muted" style="font-size: 0.875rem;">${order.establishmentId}</div>
                                    <div class="text-muted" style="font-size: 0.875rem;">${order.items?.length || 0} articles</div>
                                </div>
                                <div style="text-align: right;">
                                    <strong style="color: var(--primary);">${(order.total || 0).toLocaleString()} F</strong>
                                </div>
                            </div>
                        `;
                    }).join('');
                });
        }
        
        async function selectOrderForPayment(orderId) {
            const doc = await db.collection('orders').doc(orderId).get();
            if (!doc.exists) return;
            
            const order = doc.data();
            const container = document.getElementById('orderDetail');
            
            container.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-lg);">
                    <div>
                        <h2>Table ${order.tableNumber}</h2>
                        <p class="text-muted">${order.establishmentId}</p>
