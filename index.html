<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestionResto - Application Complète</title>
    
    <style>
        /* ============================================
           DESIGN SYSTEM MODERNE
           ============================================ */
        :root {
            --primary: #667eea;
            --primary-dark: #5a67d8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-500: #6b7280;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            
            --radius: 0.5rem;
            --radius-lg: 1rem;
            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
            
            /* Responsive variables */
            --sidebar-width: 260px;
            --header-height: 60px;
            --grid-gap: 1.5rem;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--gray-50);
            color: var(--text-primary);
            line-height: 1.6;
        }
        
        /* ============================================
           LAYOUT
           ============================================ */
        .app-container {
            display: flex;
            min-height: 100vh;
        }
        
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            padding: var(--spacing-lg);
            overflow-y: auto;
            z-index: 1000;
            transition: transform 0.3s ease;
        }
        
        .sidebar.mobile-hidden {
            transform: translateX(-100%);
        }
        
        .sidebar-logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            margin-bottom: var(--spacing-xl);
            padding-bottom: var(--spacing-md);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .mobile-header {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-height);
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            color: white;
            align-items: center;
            padding: 0 var(--spacing-md);
            z-index: 999;
            box-shadow: var(--shadow);
        }
        
        .hamburger-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            padding: var(--spacing-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: var(--radius);
            transition: background 0.3s;
        }
        
        .hamburger-btn:hover {
            background: rgba(255,255,255,0.1);
        }
        
        .mobile-header h1 {
            font-size: 1.25rem;
            margin-left: var(--spacing-md);
            font-weight: 600;
        }
        
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }
        
        .sidebar-overlay.active {
            display: block;
        }
        
        .nav-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            padding: var(--spacing-md);
            color: rgba(255,255,255,0.7);
            border-radius: var(--radius);
            cursor: pointer;
            margin-bottom: var(--spacing-sm);
            transition: all 0.3s;
        }
        
        .nav-item:hover, .nav-item.active {
            background: rgba(255,255,255,0.1);
            color: white;
        }
        
        .main-content {
            margin-left: 260px;
            padding: var(--spacing-xl);
            flex: 1;
        }
        
        /* ============================================
           COMPONENTS
           ============================================ */
        .card {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            padding: var(--spacing-xl);
            margin-bottom: var(--spacing-lg);
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-md) var(--spacing-xl);
            border: none;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        
        .btn-primary:hover {
            background: var(--primary-dark);
        }
        
        .btn-success {
            background: var(--success);
            color: white;
        }
        
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        
        .btn-sm {
            padding: var(--spacing-sm) var(--spacing-md);
            font-size: 0.875rem;
        }
        
        .form-control {
            width: 100%;
            padding: var(--spacing-md);
            border: 2px solid var(--gray-200);
            border-radius: var(--radius);
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .form-group {
            margin-bottom: var(--spacing-lg);
        }
        
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: var(--spacing-sm);
            color: var(--text-primary);
        }
        
        /* ============================================
           STATS CARDS
           ============================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-xl);
        }
        
        .stat-card {
            background: white;
            padding: var(--spacing-xl);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            border-left: 4px solid var(--primary);
        }
        
        .stat-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-sm);
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        
        /* ============================================
           POS LAYOUT
           ============================================ */
        .pos-layout {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: var(--spacing-xl);
            height: calc(100vh - 100px);
        }
        
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: var(--spacing-md);
            overflow-y: auto;
            padding: var(--spacing-md);
        }
        
        .item-card {
            background: white;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }
        
        .item-card:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }
        
        .item-name {
            font-weight: 700;
            margin-bottom: var(--spacing-sm);
        }
        
        .item-price {
            font-size: 1.5rem;
            color: var(--primary);
            font-weight: 700;
        }
        
        .cart-sidebar {
            background: white;
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
        }
        
        .cart-items {
            flex: 1;
            overflow-y: auto;
        }
        
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-md);
            background: var(--gray-50);
            border-radius: var(--radius);
            margin-bottom: var(--spacing-sm);
        }
        
        .cart-total {
            font-size: 1.5rem;
            font-weight: 700;
            padding: var(--spacing-lg);
            background: var(--gray-50);
            border-radius: var(--radius);
            text-align: right;
        }
        
        /* ============================================
           TABLE
           ============================================ */
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        
        th {
            background: var(--gray-100);
            padding: var(--spacing-md);
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid var(--gray-200);
        }
        
        td {
            padding: var(--spacing-md);
            border-bottom: 1px solid var(--gray-200);
        }
        
        tr:hover {
            background: var(--gray-50);
        }
        
        /* ============================================
           UTILITIES
           ============================================ */
        .hidden {
            display: none !important;
        }
        
        .text-center {
            text-align: center;
        }
        
        .text-muted {
            color: var(--text-secondary);
        }
        
        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .badge-success {
            background: #dcfce7;
            color: var(--success);
        }
        
        .badge-warning {
            background: #fef3c7;
            color: var(--warning);
        }
        
        .badge-danger {
            background: #fee2e2;
            color: var(--danger);
        }
        
        /* ============================================
           LOGIN PAGE
           ============================================ */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .login-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl) * 2;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        
        .login-logo {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: var(--spacing-xl);
            color: var(--primary);
        }
        
        /* ============================================
           KDS (Kitchen Display System)
           ============================================ */
        .kds-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: var(--spacing-lg);
        }
        
        .order-card {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: var(--spacing-xl);
            border-left: 4px solid var(--warning);
        }
        
        .order-card.preparing {
            border-left-color: var(--info);
        }
        
        .order-card.ready {
            border-left-color: var(--success);
        }
        
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
            padding-bottom: var(--spacing-md);
            border-bottom: 2px solid var(--gray-200);
        }
        
        .order-time {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--danger);
        }
        
        .order-items-list {
            margin-bottom: var(--spacing-lg);
        }
        
        .order-item-line {
            display: flex;
            justify-content: space-between;
            padding: var(--spacing-sm) 0;
        }
        
        /* ============================================
           MODAL
           ============================================ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        
        .modal-content {
            background: white;
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
            padding-bottom: var(--spacing-md);
            border-bottom: 2px solid var(--gray-200);
        }
        
        .modal-close {
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
        }
        
        .modal-close:hover {
            color: var(--danger);
        }
        
        /* ============================================
           CUSTOMIZATION MODAL
           ============================================ */
        .customization-section {
            margin-bottom: var(--spacing-lg);
            padding: var(--spacing-md);
            background: var(--gray-50);
            border-radius: var(--radius);
        }
        
        .customization-section h4 {
            margin-bottom: var(--spacing-md);
            color: var(--text-primary);
        }
        
        .topping-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: var(--spacing-sm);
        }
        
        .topping-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-sm);
            background: white;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .topping-item:hover {
            border-color: var(--primary);
        }
        
        .topping-item.selected {
            border-color: var(--primary);
            background: rgba(102, 126, 234, 0.1);
        }
        
        .topping-item input[type="checkbox"] {
            cursor: pointer;
        }
        
        .sauce-selector {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-sm);
        }
        
        .sauce-option {
            padding: var(--spacing-md);
            background: white;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .sauce-option:hover {
            border-color: var(--primary);
        }
        
        .sauce-option.selected {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }
        
        /* ============================================
           RESPONSIVE DESIGN - MOBILE & TABLET
           ============================================ */
        
        /* Tablets (iPad, Android tablets) */
        @media (max-width: 1024px) {
            :root {
                --sidebar-width: 220px;
                --grid-gap: 1rem;
            }
            
            .main-content {
                margin-left: 220px;
                padding: var(--spacing-lg);
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .pos-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }
            
            .kds-grid {
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            }
            
            .topping-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
        
        /* Mobile devices (phones) */
        @media (max-width: 768px) {
            :root {
                --spacing-md: 0.75rem;
                --spacing-lg: 1rem;
                --spacing-xl: 1.25rem;
            }
            
            .mobile-header {
                display: flex;
            }
            
            .sidebar {
                transform: translateX(-100%);
            }
            
            .sidebar.mobile-visible {
                transform: translateX(0);
            }
            
            .main-content {
                margin-left: 0;
                margin-top: var(--header-height);
                padding: var(--spacing-md);
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
                gap: var(--spacing-md);
            }
            
            .pos-container {
                flex-direction: column;
            }
            
            .pos-items {
                width: 100%;
                margin-bottom: var(--spacing-md);
            }
            
            .pos-cart {
                width: 100%;
                position: static;
            }
            
            .pos-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: var(--spacing-sm);
            }
            
            .pos-item {
                padding: var(--spacing-sm);
                font-size: 0.875rem;
            }
            
            .kds-grid {
                grid-template-columns: 1fr;
                gap: var(--spacing-md);
            }
            
            .order-card {
                padding: var(--spacing-md);
            }
            
            .modal-content {
                width: 95%;
                padding: var(--spacing-md);
                max-height: 85vh;
            }
            
            .modal-header h2 {
                font-size: 1.25rem;
            }
            
            .topping-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
            
            .btn {
                padding: var(--spacing-sm) var(--spacing-md);
                font-size: 0.875rem;
            }
            
            .card {
                padding: var(--spacing-md);
                margin-bottom: var(--spacing-md);
            }
            
            table {
                font-size: 0.875rem;
            }
            
            .form-group {
                margin-bottom: var(--spacing-md);
            }
        }
        
        /* Small phones */
        @media (max-width: 480px) {
            .pos-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .topping-grid {
                grid-template-columns: 1fr;
            }
            
            .sauce-selector {
                flex-direction: column;
            }
            
            .modal-content {
                width: 100%;
                max-height: 100vh;
                border-radius: 0;
            }
            
            .btn-group {
                flex-direction: column;
                width: 100%;
            }
            
            .btn-group .btn {
                width: 100%;
            }
        }
        
        /* Touch device optimizations (iOS & Android) */
        @media (hover: none) and (pointer: coarse) {
            /* Larger touch targets */
            .btn {
                min-height: 44px;
                padding: var(--spacing-md) var(--spacing-lg);
            }
            
            .nav-item {
                min-height: 48px;
            }
            
            .pos-item {
                min-height: 80px;
            }
            
            .topping-item {
                min-height: 48px;
                padding: var(--spacing-md);
            }
            
            .sauce-option {
                min-height: 48px;
                padding: var(--spacing-md) var(--spacing-lg);
            }
            
            /* Remove hover effects on touch devices */
            .btn:hover,
            .nav-item:hover,
            .pos-item:hover,
            .topping-item:hover,
            .sauce-option:hover {
                transform: none;
            }
            
            /* Active states for touch feedback */
            .btn:active {
                transform: scale(0.97);
            }
            
            .pos-item:active {
                transform: scale(0.95);
            }
            
            /* Disable text selection on interactive elements */
            .btn, .pos-item, .nav-item, .topping-item, .sauce-option {
                -webkit-user-select: none;
                user-select: none;
                -webkit-tap-highlight-color: transparent;
            }
        }
        
        /* Landscape orientation on mobile */
        @media (max-width: 768px) and (orientation: landscape) {
            .mobile-header {
                height: 48px;
            }
            
            .main-content {
                margin-top: 48px;
            }
            
            .pos-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
            
            .kds-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        /* iOS specific fixes */
        @supports (-webkit-touch-callout: none) {
            /* Safe area for iPhone notch */
            .mobile-header {
                padding-top: env(safe-area-inset-top);
                height: calc(var(--header-height) + env(safe-area-inset-top));
            }
            
            .main-content {
                padding-bottom: env(safe-area-inset-bottom);
            }
            
            .sidebar {
                padding-top: calc(var(--spacing-lg) + env(safe-area-inset-top));
            }
            
            /* Fix for iOS input zoom */
            input[type="text"],
            input[type="number"],
            input[type="email"],
            input[type="password"],
            select,
            textarea {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Container Principal -->
    <div id="app"></div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        // ============================================
        // CONFIGURATION FIREBASE
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyA-3cyKsOJ-SB23bSEtbh1anAt-mB0htLs",
            authDomain: "thaigest.firebaseapp.com",
            projectId: "thaigest",
            storageBucket: "thaigest.firebasestorage.app",
            messagingSenderId: "738590645148",
            appId: "1:738590645148:web:bc60f86c5121fb46a74659",
            measurementId: "G-LLBPYH4ZN6"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        // ============================================
        // STATE GLOBAL
        // ============================================
        let currentUser = null;
        let currentPage = 'login';
        let currentEstablishment = null;
        let cart = [];
        let allItems = [];
        
        // ============================================
        // ROUTING & RENDERING
        // ============================================
        function renderApp() {
            const app = document.getElementById('app');
            
            if (!currentUser) {
                app.innerHTML = renderLoginPage();
                return;
            }
            
            app.innerHTML = `
                <div class="app-container">
                    <!-- Mobile Header -->
                    <div class="mobile-header">
                        <button class="hamburger-btn" onclick="toggleMobileSidebar()">☰</button>
                        <h1>🍽️ GestionResto</h1>
                    </div>
                    
                    <!-- Sidebar Overlay -->
                    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleMobileSidebar()"></div>
                    
                    ${renderSidebar()}
                    <main class="main-content">
                        ${renderCurrentPage()}
                    </main>
                </div>
            `;
            
            attachEventListeners();
        }
        
        function renderSidebar() {
            return `
                <nav class="sidebar">
                    <div class="sidebar-logo">🍽️ GestionResto</div>
                    <div class="nav-item ${currentPage === 'dashboard' ? 'active' : ''}" onclick="navigateTo('dashboard')">
                        📊 Dashboard
                    </div>
                    <div class="nav-item ${currentPage === 'pos-sha' ? 'active' : ''}" onclick="navigateTo('pos-sha')">
                        💳 POS Le Sha
                    </div>
                    <div class="nav-item ${currentPage === 'pos-shiba' ? 'active' : ''}" onclick="navigateTo('pos-shiba')">
                        💳 POS Le Shiba
                    </div>
                    <div class="nav-item ${currentPage === 'payments' ? 'active' : ''}" onclick="navigateTo('payments')">

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const userDoc = await db.collection('users').doc(userCredential.user.uid).get();
                
                if (!userDoc.exists || !userDoc.data().active) {
                    alert('Compte inactif');
                    await auth.signOut();
                    return;
                }
                
                currentUser = { uid: userCredential.user.uid, ...userDoc.data() };
                currentPage = 'dashboard';
                renderApp();
            } catch (error) {
                alert('Erreur de connexion: ' + error.message);

        async function loadDashboardStats() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            const ordersSnap = await db.collection('orders')
                .where('createdAt', '>=', today)
                .get();
            
            let totalRevenue = 0;
            let orderCount = 0;
            const activeTables = new Set();
            
            ordersSnap.docs.forEach(doc => {
                const data = doc.data();
                if (data.total) totalRevenue += data.total;
                orderCount++;
                if (data.status === 'pending') activeTables.add(data.tableNumber);
            });
            
            const avgTicket = orderCount > 0 ? Math.round(totalRevenue / orderCount) : 0;
            
            setTimeout(() => {
                document.getElementById('statRevenue').textContent = `${totalRevenue.toLocaleString()} F`;
                document.getElementById('statOrders').textContent = orderCount;
                document.getElementById('statAvg').textContent = `${avgTicket.toLocaleString()} F`;
                document.getElementById('statTables').textContent = activeTables.size;
            }, 100);
            
            loadRecentOrders();
        }

            const snapshot = await db.collection('orders')
                .orderBy('createdAt', 'desc')
                .limit(10)
                .get();
            
            const container = document.getElementById('recentOrders');
            
            if (snapshot.empty) {
                container.innerHTML = '<p class="text-muted">Aucune commande récente</p>';

            container.innerHTML = `

        function renderKDS() {
            loadKDSOrders();
            return `

        let kdsUnsubscribe = null;
        
        async function loadKDSOrders() {
            // Désabonner l'ancien listener
            if (kdsUnsubscribe) {
                kdsUnsubscribe();
            }
            
            const establishment = document.getElementById('kdsEstablishment')?.value;
            const statusFilter = document.getElementById('kdsStatusFilter')?.value || 'active';
            
            let query = db.collection('orders');
            
            // Filtrer par statut
            if (statusFilter === 'active') {
                query = query.where('status', 'in', ['pending', 'preparing', 'ready']);
            } else if (statusFilter !== 'all') {
                query = query.where('status', '==', statusFilter);
            }
            
            // Pas de orderBy pour éviter les erreurs d'index
            
            // Listener en temps réel
            kdsUnsubscribe = query.onSnapshot(snapshot => {
                let orders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                // Filtrer par établissement côté client
                if (establishment) {
                    orders = orders.filter(o => o.establishmentId === establishment);
                }
                
                // Filtrer les commandes actives si nécessaire
                if (statusFilter === 'active') {
                    orders = orders.filter(o => ['pending', 'preparing', 'ready'].includes(o.status));
                }
                
                renderKDSCards(orders);
            });
        }
        
        function renderKDSCards(orders) {
            const grid = document.getElementById('kdsGrid');
            const countEl = document.getElementById('kdsCount');
            
            if (!grid) return;
            
            if (countEl) countEl.textContent = orders.length;
            
            if (orders.length === 0) {
                grid.innerHTML = '<p class="text-muted text-center" style="grid-column: 1 / -1;">Aucune commande en cours</p>';
                return;
            }
            
            // Trier par date
            orders.sort((a, b) => {
                const aTime = a.createdAt?.toDate() || new Date();
                const bTime = b.createdAt?.toDate() || new Date();
                return aTime - bTime;
            });
            
            grid.innerHTML = orders.map(order => {
                const elapsedMinutes = order.createdAt 
                    ? Math.floor((new Date() - order.createdAt.toDate()) / 60000)
                    : 0;
                
                const statusClass = order.status === 'preparing' ? 'preparing' : 
                                   order.status === 'ready' ? 'ready' : '';
                
                const statusText = order.status === 'preparing' ? '👨‍🍳 En préparation' :
                                  order.status === 'ready' ? '✅ Prêt' : '⏳ Nouvelle commande';
                
                const statusBadge = order.status === 'preparing' ? 'badge-info' :
                                   order.status === 'ready' ? 'badge-success' : 'badge-warning';
                
                const timeColor = elapsedMinutes > 15 ? 'var(--danger)' : 
                                 elapsedMinutes > 10 ? 'var(--warning)' : 'var(--text-secondary)';
                
                return `
                    <div class="order-card ${statusClass}">
                        <div class="order-header">
                            <div>
                                <h2 style="margin: 0;">Table ${order.tableNumber}</h2>
                                <span class="badge ${statusBadge}">${statusText}</span>
                                <div class="text-muted" style="font-size: 0.875rem; margin-top: 0.25rem;">${order.establishmentId}</div>
                            </div>
                            <div class="order-time" style="color: ${timeColor};">${elapsedMinutes}min</div>
                        </div>
                        
                        <div class="order-items-list">
                            ${order.items.map(item => `
                                <div class="order-item-line">
                                    <span><strong style="color: var(--primary); font-size: 1.1rem;">×${item.quantity}</strong> ${item.itemName}</span>
                                    ${item.customization ? `
                                        <div class="text-muted" style="font-size: 0.75rem; margin-left: 1.5rem; margin-top: 0.25rem;">
                                            ${item.customization.toppings?.length > 0 ? `🧀 + ${item.customization.toppings.join(', ')}` : ''}
                                            ${item.customization.sauce ? `<br>🥫 ${item.customization.sauce}` : ''}
                                            ${item.customization.notes ? `<br>📝 ${item.customization.notes}` : ''}
                                        </div>
                                    ` : ''}
                                    ${item.components && item.components.length > 0 ? `
                                        <div class="text-muted" style="font-size: 0.75rem; margin-left: 1.5rem;">
                                            🧩 ${item.components.map(c => c.itemName).join(', ')}
                                        </div>
                                    ` : ''}
                                </div>
                            `).join('')}
                        </div>
                        
                        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--spacing-sm); margin-top: var(--spacing-md);">
                            ${order.status === 'pending' ? `
                                <button class="btn btn-primary btn-sm" onclick="updateOrderStatus('${order.id}', 'preparing')">
                                    ▶️ Démarrer
                                </button>
                                <button class="btn btn-danger btn-sm" onclick="cancelOrder('${order.id}', '${order.tableNumber}')">
                                    ❌ Refuser
                                </button>
                            ` : ''}
                            ${order.status === 'preparing' ? `
                                <button class="btn btn-success btn-sm" onclick="updateOrderStatus('${order.id}', 'ready')">
                                    ✓ Prêt
                                </button>
                                <button class="btn btn-warning btn-sm" style="color: white;" onclick="updateOrderStatus('${order.id}', 'pending')">
                                    ↩️ Remettre
                                </button>
                            ` : ''}
                            ${order.status === 'ready' ? `
                                <button class="btn btn-success btn-sm" style="grid-column: span 2;" disabled>
                                    ✅ Commande Prête pour Service
                                </button>
                            ` : ''}
                        </div>
                        
                        <div style="margin-top: var(--spacing-md); padding-top: var(--spacing-md); border-top: 1px solid var(--gray-200);">
                            <button class="btn btn-sm" onclick="showOrderDetails('${order.id}')" style="width: 100%;">
                                👁️ Détails complets
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        async function cancelOrder(orderId, tableNumber) {
            const reason = prompt(`Annuler la commande de la Table ${tableNumber}?\n\nRaison (optionnel):`);
            
            if (reason === null) return; // User cancelled
            
            if (!confirm(`Confirmer l'annulation de la Table ${tableNumber} ?`)) return;
            
            try {
                await db.collection('orders').doc(orderId).update({
                    status: 'cancelled',
                    cancelledAt: firebase.firestore.FieldValue.serverTimestamp(),
                    cancelledBy: currentUser.uid,
                    cancellationReason: reason || 'Non spécifié'
                });
                
                alert('✅ Commande annulée');
            } catch (error) {
                alert('❌ Erreur: ' + error.message);
            }
        }

                .where('establishments', 'array-contains', establishment)
                .where('active', '==', true)
                .where('type', '==', 'finished')
                .get();
            
            allItems = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            
            // Extraire les catégories uniques
            const categories = [...new Set(allItems.map(item => item.category).filter(Boolean))];
            const categoryFilter = document.getElementById('categoryFilter');
            if (categoryFilter) {
                categoryFilter.innerHTML = '<option value="">Toutes catégories</option>' +
                    categories.map(cat => `<option value="${cat}">${cat}</option>`).join('');

            renderPOSItems(allItems);

        function filterPOSItems() {
            const search = document.getElementById('searchItems').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            
            const filtered = allItems.filter(item => {
                const matchSearch = item.name.toLowerCase().includes(search) ||
                                   item.category.toLowerCase().includes(search);
                const matchCategory = !category || item.category === category;
                return matchSearch && matchCategory;
            });
            renderPOSItems(filtered);

                        <!-- Sauces Section -->

        function toggleTopping(toppingId) {
            const checkbox = document.getElementById(`topping-${toppingId}`);
            const toppingDiv = checkbox.closest('.topping-item');
            
            if (selectedToppings.includes(toppingId)) {
                selectedToppings = selectedToppings.filter(id => id !== toppingId);
                checkbox.checked = false;
                toppingDiv.classList.remove('selected');
            } else {
                selectedToppings.push(toppingId);
                checkbox.checked = true;
                toppingDiv.classList.add('selected');
            }
            
            updateCustomizationPrice();
        }
        
        function selectSauce(sauceId) {
            selectedSauce = sauceId;
            
            // Update UI
            document.querySelectorAll('.sauce-option').forEach(el => {
                el.classList.remove('selected');
            });
            event.target.classList.add('selected');
        }
        
        function updateCustomizationPrice() {
            if (!currentCustomizingItem) return;
            
            let total = currentCustomizingItem.price;
            
            selectedToppings.forEach(toppingId => {
                const topping = availableToppings.find(t => t.id === toppingId);
                if (topping) total += topping.price;
            });
            
            const totalPriceEl = document.getElementById('totalPrice');
            if (totalPriceEl) {
                totalPriceEl.textContent = total.toLocaleString() + ' F';
            }
        }
        
        function addCustomizedToCart() {
            if (!currentCustomizingItem) return;
            
            const customizedItem = { ...currentCustomizingItem };
            
            // Calculate final price with toppings
            let finalPrice = customizedItem.price;
            const toppingDetails = [];
            
            selectedToppings.forEach(toppingId => {
                const topping = availableToppings.find(t => t.id === toppingId);
                if (topping) {
                    finalPrice += topping.price;
                    toppingDetails.push(topping.name);
                }
            });
            
            // Build customization summary
            const customization = {
                toppings: toppingDetails,
                sauce: selectedSauce ? availableSauces.find(s => s.id === selectedSauce)?.name : null,
                notes: customNotes
            };
            
            // Create display name
            let displayName = customizedItem.name;
            if (toppingDetails.length > 0) {
                displayName += ` + ${toppingDetails.join(', ')}`;
            }
            if (customization.sauce) {
                displayName += ` (${customization.sauce})`;
            }
            
            // Add to cart with customization
            const cartItem = {
                ...customizedItem,
                price: finalPrice,
                originalPrice: customizedItem.price,
                customization: customization,
                displayName: displayName
            };
            
            addToCart(cartItem);
            closeCustomizationModal();
        }
        
        function closeCustomizationModal() {
            const modal = document.getElementById('customizationModal');
            if (modal) {
                modal.remove();
            }
            currentCustomizingItem = null;
            selectedToppings = [];
            selectedSauce = null;
            customNotes = '';
        }
        
        function addToCart(item) {
            // Check if same item with same customization exists
            const existingIndex = cart.findIndex(c => 
                c.id === item.id && 
                JSON.stringify(c.customization) === JSON.stringify(item.customization)
            );
            
            if (existingIndex >= 0) {
                cart[existingIndex].quantity++;
            } else {
                cart.push({ ...item, quantity: 1 });
            }
            renderCart();
        }
        
        function renderCart() {
            const container = document.getElementById('cartItems');
            
            if (cart.length === 0) {
                container.innerHTML = '<p class="text-muted text-center">Panier vide</p>';
                document.getElementById('cartSubtotal').textContent = '0 F';
                document.getElementById('cartTax').textContent = '0 F';
                document.getElementById('cartTotal').textContent = 'Total: 0 F';
                return;
            }
            
            container.innerHTML = cart.map((item, index) => {
                const displayName = item.displayName || item.name;
                const customInfo = item.customization ? `
                    <div class="text-muted" style="font-size: 0.75rem; margin-top: 0.25rem;">
                        ${item.customization.toppings?.length > 0 ? `+ ${item.customization.toppings.join(', ')}` : ''}
                        ${item.customization.sauce ? ` • ${item.customization.sauce}` : ''}
                        ${item.customization.notes ? `<br>📝 ${item.customization.notes}` : ''}
                    </div>
                ` : '';
                
                return `
                    <div class="cart-item">
                        <div style="flex: 1;">
                            <strong>${displayName}</strong>
                            <div class="text-muted" style="font-size: 0.875rem;">${item.price.toLocaleString()} F × ${item.quantity}</div>
                            ${customInfo}
                        </div>
                        <div style="display: flex; gap: 0.5rem; align-items: center;">
                            <button class="btn btn-sm" onclick="updateCartQty(${index}, -1)">−</button>
                            <span style="font-weight: 700;">${item.quantity}</span>
                            <button class="btn btn-sm" onclick="updateCartQty(${index}, 1)">+</button>
                            <button class="btn btn-sm btn-danger" onclick="removeFromCart(${index})">🗑️</button>
                        </div>
                    </div>
                `;
            }).join('');
            
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const tax = Math.round(subtotal * 0.1);
            const total = subtotal + tax;
            
            document.getElementById('cartSubtotal').textContent = `${subtotal.toLocaleString()} F`;
            document.getElementById('cartTax').textContent = `${tax.toLocaleString()} F`;
            document.getElementById('cartTotal').textContent = `Total: ${total.toLocaleString()} F`;
        }
        
        function updateCartQty(index, delta) {
            cart[index].quantity += delta;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
            renderCart();
        }
        
        function removeFromCart(index) {
            cart.splice(index, 1);
            renderCart();
        }
        
        function clearCart() {
            if (cart.length === 0) return;
            
            if (confirm('Vider le panier ?')) {
                cart = [];
                renderCart();
            }
        }
        
        async function processOrder(establishment) {
            const tableNumber = document.getElementById('tableNumber').value;
            const orderNotes = document.getElementById('orderNotes')?.value || '';
            
            if (!tableNumber) {
                alert('Veuillez saisir un numéro de table');
                return;
            }
            
            if (cart.length === 0) {
                alert('Le panier est vide');
                return;
            }
            
            try {
                const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                const total = Math.round(subtotal * 1.1);
                
                const orderData = {
                    tableNumber: tableNumber,
                    establishmentId: establishment || currentEstablishment,
                    notes: orderNotes,
                    items: cart.map(item => ({
                        itemId: item.id,
                        itemName: item.displayName || item.name,
                        price: item.price,
                        quantity: item.quantity,
                        components: item.components || [],
                        customization: item.customization || null,
                        originalPrice: item.originalPrice || item.price
                    })),
                    status: 'pending',
                    subtotal: subtotal,
                    total: total,
                    createdBy: currentUser.uid,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                };
                
                // Créer la commande
                const orderRef = await db.collection('orders').add(orderData);
                
                // Déduire les stocks si BOM configuré
                for (const cartItem of cart) {
                    if (cartItem.components && cartItem.components.length > 0) {
                        for (const component of cartItem.components) {
                            const stockQuery = await db.collection('stock')
                                .where('itemId', '==', component.itemId)
                                .where('establishmentId', '==', establishment || currentEstablishment)
                                .get();
                            
                            if (!stockQuery.empty) {
                                const stockDoc = stockQuery.docs[0];
                                const currentStock = stockDoc.data().quantity || 0;
                                const deduction = component.quantity * cartItem.quantity;
                                
                                await stockDoc.ref.update({
                                    quantity: Math.max(0, currentStock - deduction),
                                    lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                                });
                            }
                        }
                    }
                }
                
                alert('✅ Commande enregistrée avec succès !\nTable ' + tableNumber);
                cart = [];
                document.getElementById('tableNumber').value = '';
                if (document.getElementById('orderNotes')) {
                    document.getElementById('orderNotes').value = '';
                }
                renderCart();
            } catch (error) {
                alert('❌ Erreur: ' + error.message);
            }
        }
        
        // ============================================
        // PAIEMENTS
        // ============================================
        let paymentsUnsubscribe = null;
        
        function renderPayments() {
            loadPendingOrders();
            return `
                <h1>💰 Paiements</h1>
                <p class="text-muted">Gestion des encaissements</p>
                
                <div style="display: grid; grid-template-columns: 350px 1fr; gap: var(--spacing-xl);">
                    <div class="card">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-md);">
                            <h3>Tables actives</h3>
                            <button class="btn btn-sm" onclick="loadPendingOrders()">🔄</button>
                        </div>
                        <div id="tablesList">Chargement...</div>
                    </div>
                    
                    <div class="card">
                        <div id="orderDetail">
                            <p class="text-muted text-center">Sélectionnez une table</p>
                        </div>
                    </div>

        async function loadPendingOrders() {
            // Désabonner l'ancien listener
            if (paymentsUnsubscribe) {
                paymentsUnsubscribe();
            }
            
            // Listener en temps réel - SANS orderBy pour éviter l'erreur d'index
            paymentsUnsubscribe = db.collection('orders')
                .where('status', 'in', ['pending', 'preparing', 'ready'])
                .onSnapshot(snapshot => {
                    const container = document.getElementById('tablesList');
                    
                    if (!container) return;
                    
                    if (snapshot.empty) {
                        container.innerHTML = '<p class="text-muted text-center">Aucune commande en attente</p>';
                        return;
                    }
                    
                    // Trier côté client
                    const orders = snapshot.docs
                        .map(doc => ({ id: doc.id, ...doc.data() }))
                        .sort((a, b) => {
                            const aTime = a.createdAt?.toDate() || new Date();
                            const bTime = b.createdAt?.toDate() || new Date();
                            return bTime - aTime;
                        });
                    
                    container.innerHTML = orders.map(order => {
                        const statusBadge = order.status === 'preparing' ? 'badge-info' :
                                           order.status === 'ready' ? 'badge-success' : 'badge-warning';
                        const statusText = order.status === 'preparing' ? '👨‍🍳 En préparation' :
                                          order.status === 'ready' ? '✓ Prêt' : '⏳ En attente';
                        
                        return `
                            <div class="cart-item" onclick="selectOrderForPayment('${order.id}')" style="cursor: pointer;">
                                <div>
                                    <strong>Table ${order.tableNumber}</strong>
                                    <div><span class="badge ${statusBadge}" style="font-size: 0.75rem;">${statusText}</span></div>
                                    <div class="text-muted" style="font-size: 0.875rem;">${order.establishmentId}</div>
                                    <div class="text-muted" style="font-size: 0.875rem;">${order.items?.length || 0} articles</div>
                                </div>
                                <div style="text-align: right;">
                                    <strong style="color: var(--primary);">${(order.total || 0).toLocaleString()} F</strong>
                                </div>
                            </div>
                        `;
                    }).join('');
                });
        }
        
        async function selectOrderForPayment(orderId) {
            const doc = await db.collection('orders').doc(orderId).get();
            if (!doc.exists) return;
            
            const order = doc.data();
            const container = document.getElementById('orderDetail');
            
            container.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-lg);">
                    <div>
                        <h2>Table ${order.tableNumber}</h2>
                        <p class="text-muted">${order.establishmentId}</p>
                    </div>
                </div>
                
                <div style="margin-bottom: var(--spacing-xl);">
                    ${order.items.map((item, index) => `
                        <div class="cart-item">
                            <div>
                                <strong>${item.itemName}</strong>
                                <div class="text-muted" style="font-size: 0.875rem;">
                                    ${item.price} F × ${item.quantity}

                            </div>
                            <div style="display: flex; gap: 0.5rem; align-items: center;">
                                <button class="btn btn-sm" onclick="updateOrderItemQty('${orderId}', ${index}, -1)">−</button>
                                <span style="font-weight: 700; min-width: 30px; text-align: center;">${item.quantity}</span>
                                <button class="btn btn-sm" onclick="updateOrderItemQty('${orderId}', ${index}, 1)">+</button>

                    `).join('')}
                </div>
                
                <div style="background: var(--gray-50); padding: var(--spacing-lg); border-radius: var(--radius); margin-bottom: var(--spacing-lg);">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                        <span>Sous-total HT</span>
                        <strong>${(order.subtotal || 0).toLocaleString()} F</strong>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                        <span>TVA (10%)</span>
                        <strong>${Math.round((order.total - order.subtotal) || 0).toLocaleString()} F</strong>
                    </div>
                    <div style="display: flex; justify-content: space-between; font-size: 1.25rem; border-top: 2px solid var(--gray-300); padding-top: 0.5rem; margin-top: 0.5rem;">
                        <strong>Total TTC</strong>
                        <strong style="color: var(--primary);">${(order.total || 0).toLocaleString()} F</strong>
                    </div>
                </div>
                
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--spacing-md);">
                    <button class="btn btn-success" style="padding: var(--spacing-lg);" onclick="processPaymentMethod('${orderId}', 'cash')">
                        💵 Espèces
                    </button>
                    <button class="btn btn-primary" style="padding: var(--spacing-lg);" onclick="processPaymentMethod('${orderId}', 'card')">
                        💳 Carte
                    </button>
                    <button class="btn btn-warning" style="padding: var(--spacing-lg); color: white;" onclick="processPaymentMethod('${orderId}', 'check')">
                        📝 Chèque
                    </button>
                </div>
            `;
        }
        
        async function updateOrderItemQty(orderId, itemIndex, delta) {
            const docRef = db.collection('orders').doc(orderId);
            const doc = await docRef.get();
            const order = doc.data();
            
            order.items[itemIndex].quantity += delta;
            
            if (order.items[itemIndex].quantity <= 0) {
                order.items.splice(itemIndex, 1);
            }
            
            if (order.items.length === 0) {
                await docRef.delete();
                loadPendingOrders();
                document.getElementById('orderDetail').innerHTML = '<p class="text-muted text-center">Sélectionnez une table</p>';
                return;
            }
            
            const subtotal = order.items.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const total = Math.round(subtotal * 1.1);
            
            await docRef.update({
                items: order.items,
                subtotal: subtotal,
                total: total
            });
            
            selectOrderForPayment(orderId);
        }
        
        async function removeOrderItem(orderId, itemIndex) {
            await updateOrderItemQty(orderId, itemIndex, -999);
        }
        
        async function processPaymentMethod(orderId, method) {
            const docRef = db.collection('orders').doc(orderId);
            const doc = await docRef.get();
            const order = doc.data();
            
            await db.collection('accountingEntries').add({
                type: 'revenue',
                orderId: orderId,
                amount: order.total,
                paymentMethod: method,
                establishmentId: order.establishmentId,
                description: `Table ${order.tableNumber} - ${method}`,
                createdBy: currentUser.uid,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            
            await docRef.update({
                status: 'paid',

            try {

                    active: true,

        let allStockData = [];
        let allIngredientsMap = {};
        
        async function loadStockData(establishment) {
            if (!establishment) return;
            
            const tbody = document.getElementById('stockTableBody');
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">⏳ Chargement des ingrédients...</td></tr>';
            
            // 1. Charger TOUS les ingrédients (matières premières) en UNE SEULE requête
            if (Object.keys(allIngredientsMap).length === 0) {
                const ingredientsSnap = await db.collection('items')
                    .where('type', '==', 'raw')
                    .where('active', '==', true)
                    .get();
                
                ingredientsSnap.docs.forEach(doc => {
                    allIngredientsMap[doc.id] = doc.data();
                });
            }
            
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">⏳ Chargement des stocks...</td></tr>';
            
            // 2. Charger les stocks pour cet établissement
            const snapshot = await db.collection('stock')
                .where('establishmentId', '==', establishment)
                .get();
            
            allStockData = [];
            
            // 3. Associer les stocks avec les ingrédients (en mémoire, pas de requête)
            snapshot.docs.forEach(doc => {
                const stockData = doc.data();
                const itemData = allIngredientsMap[stockData.itemId];
                
                if (itemData) {
                    allStockData.push({
                        id: doc.id,
                        ...stockData,
                        itemData: itemData
                    });
                }
            });
            
            renderStockList(allStockData);
        }
        
        function renderStockList(stockList) {
            const tbody = document.getElementById('stockTableBody');
            
            if (stockList.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Aucun stock</td></tr>';
                return;
            }
            
            // Grouper par catégorie
            const byCategory = {};
            stockList.forEach(stock => {
                const cat = stock.itemData.category || 'Non catégorisé';
                if (!byCategory[cat]) byCategory[cat] = [];
                byCategory[cat].push(stock);
            });
            
            let html = '';
            Object.entries(byCategory).sort().forEach(([category, stocks]) => {
                // Ligne de titre de catégorie
                html += `
                    <tr style="background: var(--gray-100);">
                        <td colspan="6" style="font-weight: 700; font-size: 1.1rem; padding: var(--spacing-md);">
                            📂 ${category} <span style="color: var(--text-secondary); font-weight: 400; font-size: 0.9rem;">(${stocks.length} articles)</span>
                        </td>
                    </tr>
                `;
                
                // Articles de la catégorie
                stocks.sort((a, b) => a.itemData.name.localeCompare(b.itemData.name)).forEach(stock => {
                    const item = stock.itemData;
                    const qty = stock.quantity || 0;
                    const statusClass = qty === 0 ? 'badge-danger' : qty < 10 ? 'badge-warning' : 'badge-success';
                    const statusText = qty === 0 ? '⚠️ Rupture' : qty < 10 ? '⚡ Faible' : '✓ OK';
                    
                    html += `
                        <tr>
                            <td style="padding-left: 2rem;">
                                <strong>${item.name}</strong>
                                ${item.isIngredient ? '<span class="badge badge-warning" style="margin-left: 0.5rem; font-size: 0.7rem;">Ingrédient</span>' : ''}
                            </td>

            modal.id = 'stockAdjustModal';
            
            modal.innerHTML = `
                <div class="modal-content" style="max-width: 500px;">

                            <strong>Nouveau stock:</strong> <span id="previewQty">—</span>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" onclick="closeStockAdjustModal()">Annuler</button>
                        <button class="btn btn-primary" onclick="saveStockAdjustment('${stockId}', ${currentQty})">💾 Enregistrer</button>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
            
            // Update preview on input
            document.getElementById('qtyInput').addEventListener('input', updateStockPreview);
            document.getElementById('operationType').addEventListener('change', updateStockPreview);
            
            function updateStockPreview() {
                const opType = document.getElementById('operationType').value;
                const inputVal = parseInt(document.getElementById('qtyInput').value) || 0;
                const preview = document.getElementById('previewResult');
                const previewQty = document.getElementById('previewQty');
                
                let finalQty = currentQty;
                if (opType === 'set') {
                    finalQty = inputVal;
                    document.getElementById('qtyLabel').textContent = 'Nouvelle quantité';
                } else if (opType === 'add') {
                    finalQty = currentQty + inputVal;
                    document.getElementById('qtyLabel').textContent = 'Quantité à ajouter';
                } else if (opType === 'remove') {
                    finalQty = Math.max(0, currentQty - inputVal);
                    document.getElementById('qtyLabel').textContent = 'Quantité à retirer';
                }
                
                preview.style.display = 'block';
                previewQty.textContent = finalQty;
                previewQty.style.color = finalQty === 0 ? 'var(--danger)' : finalQty < 10 ? 'var(--warning)' : 'var(--success)';

            updateStockPreview();

        async function saveStockAdjustment(stockId, currentQty) {
            const opType = document.getElementById('operationType').value;
            const inputVal = parseInt(document.getElementById('qtyInput').value) || 0;
            const reason = document.getElementById('reasonInput').value;
            
            let finalQty = currentQty;
            if (opType === 'set') {
                finalQty = inputVal;
            } else if (opType === 'add') {
                finalQty = currentQty + inputVal;
            } else if (opType === 'remove') {
                finalQty = Math.max(0, currentQty - inputVal);
            }
            
            if (finalQty < 0) {
                alert('❌ La quantité ne peut pas être négative');
                return;
            }
            
            try {
                await db.collection('stock').doc(stockId).update({
                    quantity: finalQty,
                    lastUpdated: firebase.firestore.FieldValue.serverTimestamp(),
                    updatedBy: currentUser.uid,
                    lastReason: reason || 'Ajustement manuel'
                });
                
                // Log movement
                await db.collection('stockMovements').add({
                    stockId: stockId,
                    operationType: opType,
                    previousQty: currentQty,
                    change: opType === 'set' ? (finalQty - currentQty) : inputVal,
                    newQty: finalQty,
                    reason: reason || 'Ajustement manuel',
                    createdBy: currentUser.uid,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                alert('✅ Stock mis à jour !');
                closeStockAdjustModal();
                
                // Recharger la page stock actuelle
                if (currentPage === 'stock-sha') loadStockData('Le_Sha');
                if (currentPage === 'stock-shiba') loadStockData('Le_Shiba');
            } catch (error) {
                alert('❌ Erreur: ' + error.message);
            }
        }

        async function saveBulkStockAdjustment(establishment) {
            const reason = document.getElementById('bulkReason').value || 'Livraison';
            const updates = [];
            
            for (const ingId of window.bulkSelectedIngredients) {
                const qtyInput = document.getElementById(`bulk-qty-${ingId}`);
                const qty = parseInt(qtyInput.value);
                
                if (!qty || qty <= 0) {
                    alert(`❌ Veuillez saisir une quantité valide pour tous les articles sélectionnés`);
                    return;
                }
                
                updates.push({ ingId, qty });
            }
            
            if (updates.length === 0) {
                alert('❌ Aucun article sélectionné');
                return;
            }
            
            try {
                const batch = db.batch();
                
                for (const { ingId, qty } of updates) {
                    // Chercher ou créer le stock
                    const stockQuery = await db.collection('stock')
                        .where('itemId', '==', ingId)
                        .where('establishmentId', '==', establishment)
                        .get();
                    
                    let stockRef;
                    let currentQty = 0;
                    
                    if (stockQuery.empty) {
                        // Créer nouveau stock
                        stockRef = db.collection('stock').doc();
                        batch.set(stockRef, {
                            itemId: ingId,
                            establishmentId: establishment,
                            quantity: qty,
                            lastUpdated: firebase.firestore.FieldValue.serverTimestamp(),
                            updatedBy: currentUser.uid,
                            lastReason: reason
                        });
                    } else {
                        // Mettre à jour stock existant
                        const stockDoc = stockQuery.docs[0];
                        stockRef = stockDoc.ref;
                        currentQty = stockDoc.data().quantity || 0;
                        
                        batch.update(stockRef, {
                            quantity: currentQty + qty,
                            lastUpdated: firebase.firestore.FieldValue.serverTimestamp(),
                            updatedBy: currentUser.uid,
                            lastReason: reason
                        });
                    }
                    
                    // Log movement
                    const movementRef = db.collection('stockMovements').doc();
                    batch.set(movementRef, {
                        stockId: stockRef.id,
                        itemId: ingId,
                        establishmentId: establishment,
                        operationType: 'add',
                        previousQty: currentQty,
                        change: qty,
                        newQty: currentQty + qty,
                        reason: reason,
                        createdBy: currentUser.uid,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
                
                await batch.commit();
                
                alert(`✅ Livraison enregistrée !\n${updates.length} article(s) ajouté(s) au stock.`);
                closeBulkStockModal();
                
                // Recharger
                if (currentPage === 'stock-sha') loadStockData('Le_Sha');
                if (currentPage === 'stock-shiba') loadStockData('Le_Shiba');
                
            } catch (error) {
                alert('❌ Erreur: ' + error.message);
                console.error(error);
            }
        }

        }
